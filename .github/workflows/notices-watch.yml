name: Check notices

# Every 30 minutes, one request and no build: the deployed notices.json says in
# "next_change" when a bar next appears or ends on its own (banner_until, the
# 48 hours of a "Resolved" bar, a notice's from/until). Once that moment has
# passed, the full deploy runs and writes the next one. firmware.gl-i.net
# picks the change up with its own check a few minutes later.

on:
  schedule:
    - cron: '2,32 * * * *' # before the check of firmware.gl-i.net at :07 and :37
  workflow_dispatch:

permissions:
  actions: write # start the deploy workflow

concurrency:
  group: notices-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare
        id: compare
        run: |
          # The query string gets past the CDN cache; no answer means no change.
          next=$(curl -fsS --max-time 20 "https://gl-i.net/notices.json?t=$(date +%s)" | jq -r '.next_change // empty') || exit 0
          if [ -n "$next" ] && [ "$(date -u -d "$next" +%s)" -le "$(date -u +%s)" ]; then
            echo "Change due since $next."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Next change: ${next:-none scheduled}."
          fi
      - name: Deploy
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 10 \
                   --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" -gt 0 ]; then
            echo "A deploy is already queued or running."
            exit 0
          fi
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "::notice::A bar starts or ends now, deploy started."
