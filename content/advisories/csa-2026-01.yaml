  - at: 2026-11-23T21:03Z
    text: 2,365 devices in the anonymous reports
    more: Of the devices that are not yet updated, 43 percent of the routers and 49 percent of the KVM devices show traces.
    tag: Community
  - at: 2026-11-23T10:39Z
    text: The community script can update itself
    more: It takes a new version only when its signature fits.
    tag: Community
  - at: 2026-11-23T11:33Z
    text: 1,901 devices in the anonymous reports
    more: Of the routers that are not yet updated, 44 percent show traces. Of the KVM devices, 41 percent.
    tag: Community
  - at: 2026-11-22T21:38Z
    text: Admon compares the old and the new firmware
    more: The security firmware checks what the cloud sends before it reaches a shell. At its first start it deletes known traces of the malware.
