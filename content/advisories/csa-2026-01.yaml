    note: |
      These are anonymous, unverified reports from people who ran the community script, and some devices were scanned more than once. A model and firmware with reports from at least five devices are added automatically, within 15 minutes; we add the others by hand. It is not a list of affected devices from GL.iNet's investigation, and a model or firmware missing here is not necessarily unaffected. GL.iNet staff posts the same list in its forum.

      According to GL.iNet, what matters most is whether the device was connected to GoodCloud, not the firmware version. The firmware still matters because the code that handled the command is on the device. GL.iNet closed the path in its cloud on November 20.

# GL.iNet's steps, from its notice as updated on 23 November 2026. The page shows the
# guide below instead; these go into the RSS feed.
actions:
- audience: KVM devices (Comet)
  steps:
  - title: Install the stable security firmware
    text: >-
      1.10.3 or later for RM1, RM1V2, RM1PE, RM4PE, RM10 and RM10RC, 1.8.7 or later for the RMQ1. It removes the known malware even when settings are kept. If access is known or suspected, GL.iNet advises installing it with "Save current configuration" cleared, setting the KVM up again, and not restoring a backup.
    link: { label: GL.iNet's notice, url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20 }
  - title: Check the KVM before you update, if you want to
    text: >-
      The update comes first; a check is optional. GL.iNet names the community check as the first choice for broader coverage, in check-only mode. Its own KVM quick check in the forum has limited coverage. Check before you restart, reset or update: those remove signs of earlier activity.
  - title: Replace passwords and keys
    text: >-
      If the KVM was connected to GoodCloud, replace its administrator password and any VPN and SSH keys after the update, even if a check finds nothing. Some KVMs have the cloud service on before they are linked to an account.
  - title: If it is infected, check the computer connected to it
    text: >-
      Look for programs, browser extensions or accounts you don't know, unexpected startup items or scheduled tasks, changed settings and unusual network activity. Run a full scan with up-to-date security software.
- audience: Routers
  steps:
  - title: Install the stable security firmware
    text: >-
      Available for 18 models; the notice lists the minimum version for each, and newer builds followed on November 24. Install the newest stable release for your model. It removes the known malware even when settings are kept. If access is known or suspected, GL.iNet advises installing it with "Keep Settings" off, setting the router up again, and not restoring a backup. A factory reset alone does not install the fixes. If your model is not listed, check the download center or contact support; 14 older models got new firmware on November 23 and 24.
    link: { label: GL.iNet's notice, url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20 }
  - title: Check the router before you update, if you want to
    text: >-
      The update comes first; a check is optional. GL.iNet names the community check as the first choice for broader coverage, in check-only mode. Check before you restart, reset or update: those remove signs of earlier activity. A check that finds nothing does not mean the router was unaffected.
  - title: Replace passwords and keys
    text: >-
      If the router was connected to GoodCloud, replace its administrator password and any VPN and SSH keys after the update, even if a check finds nothing. No update can undo what was already copied.
  - title: If you need help
    text: Email support@gl-inet.com to have a device assessed, to choose how to recover it, or if the update fails.

# The long form of the page. In these texts a path, a command, an option or an address
# stands between backticks; the page sets it in a monospace face. Figures from the anonymous
# reports: export of 23 November 2026, 21:03 UTC.
guide:
  glance:
    - label: Status
      value: Firmware is out
      note: For 18 router and 7 KVM models, per GL.iNet’s notice of Nov 23
    - label: In the reports
      value: 2,365 devices
      note: 2,018 routers, 347 KVM devices
    - label: Routers with traces
      value: 43%
      note: 705 of 1,632 not yet updated
    - label: KVM devices with traces
      value: 49%
      note: 127 of 258 not yet updated
  glance_note: Anonymous reports of the community script, Nov 23, 2026, 21:03 UTC. Unverified, and only from people who chose to send one.
  do_note:
    title: Was the device connected to GoodCloud?
    text: Then give it a new admin password and new VPN and SSH keys after the update, even if the check finds nothing. GL.iNet advises this for every such device. Some KVMs connect before they are linked to an account.
  steps:
    - audience: Router
      steps:
        - title: Check the device
          text: Run the community script over SSH. It is read-only and takes a minute.
          command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh
          link:
            label: GL.iNet’s guide to logging in over SSH
            url: https://docs.gl-inet.com/router/en/4/tutorials/ssh_log_in_to_the_router/
          why:
            - GL.iNet’s first quick check looked for one running process. The remote shell does not run that process, leaves no file and is gone after a restart.
            - The script runs that check and also looks at files, autostart entries and the firewall. GL.iNet’s notice now calls it the first choice for a broader check, describes it as an independent project, and says to use it for checking only.
            - SSH is on by default on GL.iNet routers, on the local network. Log in as `root` with the admin password. If you switched SSH off, turn it back on in the admin panel under Security > Admin Access (on firmware before 4.9, System > Security).
        - title: Save what it finds
          text: If the script reports traces, run it again with `--archive` before you change anything.
          command: sh gl-helper-triage.sh --archive
          why:
            - A restart removes the remote shell. A reset wipes the logs. The security firmware deletes known traces the first time it boots.
            - On a business network, talk to your cyber insurer or incident response provider first. Many policies expect a report before affected systems are changed.
        - title: Switch GoodCloud and AstroWarp off
          text: Use the GoodCloud switch in the admin panel. Leave it off until the security firmware is installed, and check it again after every upgrade.
          why:
            - The flaw was in the cloud client on the device. It could be exploited whenever that client was running, whether AstroWarp was on or off. One owner reports that an upgrade switched the client back on, along with remote access and AstroWarp.
            - Use the switch on the device. Owners report that the client keeps running and connecting even after the device has been removed from the GoodCloud account.
            - Switching it off lowers the risk from now on. It does not clean a device that was already hit. The device disappears from GoodCloud, so make sure you can reach a remote device another way.
        - title: Install the security firmware
          text: Install the newest stable release for your model. GL.iNet’s notice lists the minimum version, and newer builds for all 18 models came out on November 24. If the device was hit, or you suspect it was, install it from a file you downloaded yourself with “Keep Settings” off, set the device up again and do not restore a backup. GL.iNet now gives the same advice.
          why:
            - The version number alone does not tell you whether you have the fix. Older builds of 4.8.4, 4.9.1, 4.10.3 and 4.11.1 exist, and the reports show traces on some of them. The security builds are dated November 22 to 24, 2026.
            - "On November 23 and 24, GL.iNet also released firmware for 14 older models that its notice does not list: 4.3.31 for the GL-AP1300, GL-AR300M, GL-AR300M16, GL-AR750, GL-AR750S, GL-B1300, GL-E750, GL-MT1300, GL-MT300N-V2, GL-X750 and GL-XE300, and 4.5.24 for the GL-A1300, GL-B3000 and GL-X300B. Their changelogs list security fixes, so install it on these models too."
            - Model not on the list? GL.iNet says that does not mean it is unaffected. Check its download center or email support@gl-inet.com. Do not install firmware meant for another model. If you installed a security beta, GL.iNet says to switch to the stable firmware.
            - "GL-AXT1800: install 4.8.5, released November 24. The first security build reports `4.8.4 release2`, built on November 23, and the 4.8.4 betas from April and from November 11 are not the security build. If your router shows 4.8.4, updating to 4.8.5 removes the doubt."
            - For the GL-MT6000 and the GL-MT3000, GL.iNet also publishes open builds based on OpenWrt 25 as betas, first on November 23, the newest 4.11.2 on November 24. Its changelog says it removes the malware’s leftover files. The open builds based on OpenWrt 24, from May and June, do not include the fix.
            - GL.iNet says the update removes the known malware even when settings are kept, and calls that a targeted cleanup, not a general malware scan. Keeping your settings is still your choice, but you can be less certain that the device is clean.
            - "Why reflash a device that was hit? The update deletes the known files and autostart entries. It leaves the older backdoor’s loader and anything else that was changed. In RemoteToHome’s test, other entries in `rc.local`, cron and `/etc/udhcpc.user.d`, an added account and an added SSH key survived an update with settings kept, and the scripts ran on the new firmware."
            - A factory reset keeps the installed firmware image, and on a GL-AXT1800, root can write to that image. A reflash writes a fresh image and clears the settings in one step.
          table:
            caption: Newest stable firmware by model, released November 24. In brackets, the minimum version from GL.iNet’s notice of November 23.
            rows:
              - k: 4.11.2
                v: GL-MG1300, GL-MT3000, GL-MT6000 (at least 4.11.1)
              - k: 4.10.4
                v: GL-E5800 (at least 4.10.3)
              - k: 4.10.3
                v: GL-BE3600, GL-BE9300 (at least 4.10.2)
              - k: 4.9.4
                v: GL-BE14000 (at least 4.9.3)
              - k: 4.9.2
                v: GL-BE6500, GL-MT3600BE, GL-MT5000 (at least 4.9.1)
              - k: 4.8.8
                v: GL-BE10000 (at least 4.8.7)
              - k: 4.8.5
                v: GL-AX1800, GL-AXT1800, GL-SFT1200, GL-X3000, GL-XE3000 (at least 4.8.4)
              - k: 4.7.15
                v: GL-MT2500, GL-MT2500A, GL-X2000 (at least 4.7.14)
          link:
            label: GL.iNet’s notice, with the download for each model
            url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20
        - title: New passwords and keys
          text: "If the device was connected to GoodCloud: the admin password, VPN profiles and SSH keys, even if the check finds nothing. If it was hit: also the Wi-Fi, DDNS and cloud passwords."
          why:
            - GL.iNet now advises this for every device that was connected to GoodCloud, as a precaution. Once a key or password has been copied, no update can change that.
            - The attacker had a root shell on the devices that were hit. Everything stored on the device could be copied, and cleaning the device does not undo that.
            - "Delete the router’s VPN profile at the other end and create a new one. Export the device log from your GoodCloud account before you change that password: it may show the attacker’s command."
        - title: Switch SSH off again
          text: "If you switched it on for the check: in the admin panel under Security > Admin Access (on firmware before 4.9, System > Security)."
          link:
            label: GL.iNet’s page on the SSH switch
            url: https://docs.gl-inet.com/router/en/4/interface_guide/admin_access/#ssh
          why:
            - A service that is switched off cannot be attacked. If you do not use SSH yourself, there is no reason to leave it on.
            - GL.iNet’s firmware has SSH on by default. A reinstall without settings switches it back on, so do this after the security firmware is installed.
    - audience: KVM (Comet)
      steps:
        - title: Check the KVM
          text: In the KVM’s web interface, open Toolbox > Terminal and run the script there, not on the connected computer.
          command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh
          why:
            - GL.iNet’s quick check is `ps -aux | grep tmp` (on the RMQ1, `ps -a | grep tmp`). If it shows a process `crond -i /tmp/.log`, GL.iNet considers the device infected. GL.iNet says this check has limited coverage.
            - The script runs this check and looks at the files too. GL.iNet calls it the first choice for broader KVM coverage.
        - title: Save what it finds
          text: If the script reports traces, run it again with `--archive` before you update.
          command: sh gl-helper-triage.sh --archive
          why:
            - On all six models RemoteToHome examined, the security firmware removes the malware’s files and keeps no copy. After the update, nothing shows that the device was ever infected.
        - title: Switch the cloud service off
          text: In the KVM’s settings, until the security firmware is installed.
          why:
            - The command came over the cloud connection. With the service off it cannot arrive.
            - GL.iNet says some KVMs have the cloud service on before they are linked to an account. Having no account, or never linking one, does not prove that the KVM never connected.
        - title: Install the security firmware without the settings
          text: Version 1.10.3 or later (1.8.7 or later for the RMQ1). If the KVM was hit, or you suspect it was, clear “Save current configuration” when you install it and set the KVM up again. GL.iNet now gives the same advice.
          why:
            - An update that keeps settings also keeps the password file, the SSH keys and everything under `/etc/kvmd/user`. The malware’s installer can add an SSH key of its own.
            - On a test RM1, a boot script and an added SSH key survived an update to 1.10.3 that kept the configuration, and the script ran (RemoteToHome).
            - "On the GL-RM10, check the full version string: the security firmware reports `V1.10.3 release1`. Of seven GL-RM10 units in the reports running `V1.10.3 release8`, six show traces, five of them the malware’s files."
          link:
            label: GL.iNet’s notice, with the download for each model
            url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20
        - title: New passwords and keys
          text: "If the KVM was connected to GoodCloud: its admin password and any VPN and SSH keys, even if the check finds nothing."
          why:
            - GL.iNet now advises this for every device that was connected to GoodCloud, as a precaution. No update can undo what was already copied.
        - title: Check the computer behind it
          text: Look for programs, browser extensions, accounts and startup items you do not recognize. Run a full scan.
          why:
            - A KVM controls the keyboard and the screen of the computer it is attached to. GL.iNet is still investigating whether such computers were affected.
  risk:
    - title: GoodCloud was switched on
      text: "Of 100 such routers in the reports, 60 show traces. With GoodCloud off: 20."
    - title: Router firmware 4.7 to 4.10
      text: "On 4.7 to 4.9, seven or eight in ten routers show traces. On 4.10, about half. On 4.6 and older, and on 4.11: none."
    - title: Restarted or updated since November 20
      text: Then a clean result means little. The remote shell leaves no file, and the security firmware deletes known traces.
  table_help:
    - These are anonymous, unverified reports, and some devices were checked more than once. It is not GL.iNet’s list of affected devices.
    - A model that is missing is not necessarily safe.
    - A model and firmware with reports from five devices are added automatically. We add the others by hand.
  topics:
    - title: What GL.iNet says
      source: GL.iNet
      lead: Its cloud let messages reach other people’s devices. For a device that was hit, it now advises a reinstall without settings.
      body:
        - On November 20, 2026, GL.iNet found unauthorized access to some routers and KVM devices connected to GoodCloud. An outsider used a vulnerability in the service and installed malware on some of them.
        - "The cause, according to GL.iNet’s notice of November 23: GoodCloud’s messaging service (MQTT, running on EMQX) checked permissions incorrectly. A client could send management messages to other users’ devices. GL.iNet fixed this in its cloud (GoodCloud 3.19.14) and blocked the path on November 20."
        - On routers, a separate flaw in the AstroWarp and SD-WAN handling could turn such a message into a command run as root, even with AstroWarp off. GL.iNet says this router flaw should not be taken to explain every KVM compromise.
        - GL.iNet has published reports on these two flaws and on a third one in the remote terminal (RTTY) connection, in its repository `gl-inet/CVE-issues` on GitHub. It has asked for CVE numbers; none has been assigned yet. It lists the RTTY fix for the KVM devices in 1.10.3, and 1.8.7 for the RMQ1.
        - Stable security firmware is out for 18 router models and 7 KVM models. It disables the known malware and removes its files and traces, even when settings are kept. GL.iNet calls this a targeted cleanup, not a general malware scan.
        - "For a device with known or suspected access, GL.iNet now advises the strongest recovery it knows: install the security firmware without keeping settings, set the device up again, use new passwords and keys, and do not restore a backup. Keeping settings is still an option, but with less certainty. A factory reset alone does not install the fixes."
        - Everyone whose device was connected to GoodCloud should replace its admin password and any VPN and SSH keys, even if a check finds nothing.
        - The update comes first and a check is optional. If you check, do it before you restart, reset or update. GL.iNet names the community check as the first choice for broader coverage, in check-only mode, and says its own short KVM check has limited coverage.
        - GL.iNet emails the customers it identifies as affected, at the address of their cloud account. Not getting an email does not prove that a device was unaffected. It is still working out the number of devices, the timeline, and whether computers behind a KVM were accessed.
        - "Staff added in the forum: check open connections and running processes too, and do not trust `netstat` on a device that may be infected."
    - title: The way in
      source: Community
      lead: The cloud client put values from the cloud into shell commands without checking them.
      body:
        - The cloud client on the device has a handler for AstroWarp. It took values from a cloud message and put them into shell commands unchecked. Anyone who could send such a message could run any command as root, with AstroWarp on or off.
        - RemoteToHome found this first, in the client of a router that had been hit. The code has been in the firmware since 4.7.0 (December 5, 2024). 4.6 does not have it, and no router on 4.6 or older shows a trace.
        - Admon compared firmware 4.9.2 and 4.9.3 for the GL-BE14000. The new firmware checks and quotes these values. Eight cloud functions now reject input that contains shell syntax.
        - GL.iNet has since confirmed this flaw in its notice of November 23 and published a report on it. It adds the second part, in its cloud, that let the message reach other people’s devices.
    - title: How the attack may have run
      source: Our reading
      lead: "It looks like a schedule: model by model, each within about a minute."
      body:
        - This is our reading of the anonymous reports, not a finding of GL.iNet’s investigation. We are a handful of volunteers, and we see only what people chose to send.
        - In the reports, the routers of one model show almost the same time. The next model follows 9 to 14 minutes later.
        - "@sweep"
        - The time is when a file the attack leaves behind was last written. A later command overwrites it, so the first command may have come earlier.
        - If this is right, whoever sent the commands knew the model of each device beforehand. The cloud knows it, and the malware’s installer names eleven router models.
        - On most devices a command ran and nothing else was found. 56 devices had a remote shell. The last trace in the reports dates from November 21, 18:58 UTC.
    - title: What the reports show
      source: Reports
      lead: 2,365 devices. The share with traces depends on the firmware.
      body:
        - 2,018 routers and 347 KVM devices have sent a report. 386 of the routers and 89 of the KVM devices already run the security firmware and report clean. Of the other routers, 43 percent show traces of the attack. Of the other KVM devices, 49 percent do.
        - "@series"
        - Nobody knows why 4.11 shows no traces. The unchecked code is in 4.11.0 too, so this does not show that 4.11 was safe.
        - A device on the security firmware reports clean, even if it showed traces before. We saw 43 routers and 20 KVM devices with traces before their update, and all of them report clean after it. That is why the percentages here leave out updated devices.
    - title: The remote shell
      source: Community
      lead: A root shell that leaves no file and is gone after a restart.
      body:
        - Forum users and RemoteToHome found a remote root shell on routers. It connected to `170.39.226.219`, on a different port each time. The shells started between 20:06 and 21:40 UTC on November 20, on GL-AXT1800 and GL-MT6000 routers.
        - The shell leaves no file. Its pipe `/tmp/f` is gone after a restart. A router that has been restarted or updated since then can pass every check of running processes even if it was hit.
        - The server was rented. After RemoteToHome’s abuse report, the hosting provider suspended it on November 21 and preserved it for an investigation.
        - One of the attacker’s commands made a router call `66.245.219.252` on port 8899, the server and path the KVM malware reports to. RemoteToHome found it on one of its routers. So the attack on routers and the malware on KVM devices share a server.
    - title: The malware and its installer
      source: Community
      lead: "`gl-helper`, its helper `gb`, and how they survive a restart."
      body:
        - A forum user fetched the installer and analyzed it with an AI tool. The file names and addresses decode as stated. We have not verified the description of what it does.
        - The installer puts `gl-helper` and a helper named `gb` into `/etc/glinet/.cache`. If it cannot write there, it uses `/etc/gl_nas/.cache`, `/userdata/.gl`, `/overlay/.gl` or `/tmp/.gl`. It keeps a copy in `/etc/config/.gl`, because that directory survives a firmware update that keeps settings.
        - It adds itself to `/etc/rc.local` and to the crontab. A script named `watch.sh` puts everything back every three minutes. `crond -i /tmp/.log`, the process GL.iNet’s check looks for, is the name the malware gives its own process.
        - Other options backdate its files, add an SSH key named `gl-agent`, and point the remote terminal service at the attacker’s server `65.20.71.131`. The files come from `66.245.219.252`.
        - Forum users have since taken the helper `gb` apart. It runs only commands signed by the operator. `gl-helper` itself is wrapped in a custom packer, and nobody has published what is inside.
    - title: KVM devices
      source: Community
      lead: Hit a day earlier, and some firmware deletes the evidence.
      body:
        - One forum user recorded a GL-RM1 being taken over on November 19 at 02:35 UTC, a day before the date in GL.iNet’s notice. It connected to `65.20.71.131`, fetched files from `66.245.219.252` and looked up `gl-inet.top`, a name that was registered anew on November 16.
        - Firmware 1.10.2 for the RM1PE deletes the malware’s files at boot and keeps no copy. The 1.10.2 builds for the RM1 and RM1V2 have no such cleanup.
        - "The stable security firmware is 1.10.3 (1.8.7 for the RMQ1). GL.iNet says it removes the malware. RemoteToHome examined 1.10.3 for all six models: each deletes the malware’s files at boot and keeps no copy. All 89 KVM devices in the reports running `V1.10.3 release1` report clean. A `V1.10.3 release8` for the GL-RM10, in the reports since November 22, 00:10 UTC, does not remove it: six of seven such devices show traces."
    - title: The security firmware
      source: Community
      lead: It closes the flaw and deletes known traces the first time it boots.
      body:
        - GL.iNet says the update disables the known malware of this incident and removes its files and traces, even when settings are kept. It calls this a targeted cleanup, not a general malware scan or a full integrity check. Comparing the old and the new firmware shows what it does.
        - The router firmware cleans up once, on its first boot. Where `/etc/config/.gl` exists, it deletes that directory, the malware’s line in `/etc/rc.local` and its cron lines. It always restores `/etc/init.d/urandom_seed`.
        - It leaves the scripts in `/etc/glinet/.cache`, does nothing when `/etc/config/.gl` is missing, and does not remove the older backdoor’s programs.
        - So check first, then update, then check again.
    - title: A trace on GL.iNet’s side
      source: Community
      lead: The device log in your GoodCloud account may show the attacker’s command.
      body:
        - The device log that you can export from a GoodCloud account shows responses that contain `astrowarp` with the id 1. Ordinary commands have a 32-character id.
        - One user found such a response for a GL-BE14000 in the same second as the trace on the router. GL.iNet keeps this log, so it survives a restart.
        - Export it before you change the GoodCloud password. One owner reports that it was gone afterward. We have not checked this ourselves.
    - title: Update, reset or reflash?
      source: Community
      lead: "For a device that was hit, GL.iNet and we now give the same advice: reinstall without the settings."
      body:
        - GL.iNet’s notice, as updated on November 23, calls a reinstall of the security firmware without kept settings the strongest recovery, followed by a new setup with new passwords and keys and without a restored backup. Keeping settings is still an option, but with less certainty, because other changes may remain. A factory reset alone does not install the fixes. Earlier versions of the notice said the settings could be kept, and before that pointed to a factory reset.
        - "The firmware comparison shows what the update deletes: the known files and autostart entries. It leaves the older backdoor’s programs. And once keys and passwords have been copied, no update changes that."
        - "RemoteToHome tested the update with settings kept on a GL-MT3000: it removes the startup entries it knows. Other entries in `rc.local`, cron and `/etc/udhcpc.user.d`, an added account and an added SSH key survived and ran on the new firmware."
        - A factory reset leaves the installed firmware image as it is. On a GL-AXT1800, RemoteToHome found that image writable from a root shell, and on another one the boot loader too. Nobody has reported such a change on a hit device; the boot loader of that router matched the one GL.iNet publishes.
        - GL.iNet cites this work too. It says that a reset or a reinstall may not rewrite every part of the flash, and that this is a limitation of recovery, not a sign that boot components were changed in this attack.
        - So for a device that was hit, RemoteToHome advises a full reflash without keeping settings, in one step and from a file you downloaded yourself. So do we, and so does GL.iNet now.
