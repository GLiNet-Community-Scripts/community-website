# GL.iNet security notice of 20 November 2026: cloud remote management
# (GoodCloud), routers and KVM devices. What GL.iNet says comes from its notice
# (last edited 23 November 2026, 01:53 UTC) and from staff posts in its forum.
# What the community found is marked as such, with its source.
id: CSA-2026-01
title: Cloud remote management flaw used to install malware on routers and KVM devices
severity: critical
exploited: true
status: fix-rolling-out
published: 2026-11-21
updated: 2026-11-23T12:00Z
cve: []
confirmed: gl-inet-public

banner: >-
  GL.iNet's cloud remote management was used to install malware on routers and KVM devices. Security firmware is out. Check your device before you install it.

summary: >-
  Attackers used a flaw in GL.iNet’s cloud remote management (GoodCloud) to run commands on routers and KVM devices, and installed malware on some. GL.iNet has closed the path in its cloud and has released security firmware that removes the known malware. No update takes back what was copied from a device, so check yours before you update.

affected:
  summary: >-
    Some GL.iNet routers and KVM devices, reached through GL.iNet's cloud remote management. GL.iNet has not published which models or firmware versions were affected. It lists the models that have security firmware and emails the customers it identifies as affected. The table below shows where traces were reported.
  products: [ Routers, KVM devices (Comet) ]
  firmware: Not published
  fixed_in: Firmware from 22 Nov
