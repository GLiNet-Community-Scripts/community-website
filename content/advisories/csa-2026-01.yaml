apps_note: >-
  None of the community apps on this site are named in GL.iNet's notice. A
  factory reset removes installed apps and their settings, so re-run their
  installers afterwards.

community_fix:
  title: The community built a script that also checks the files on a device
  text: |
    GL.iNet's quick check looks at the processes that are running right now. The community has reacted with a script by Admon that runs the same check and also looks at the files on a GL.iNet router or KVM device: the ones this malware is known to leave behind, including the entries that would start it again after a restart. It can save evidence from the device first and, if you ask it to, remove what it found.
  caveat: >-
    Community work, not a GL.iNet tool. GL.iNet has not reviewed or endorsed
    it. The script knows only the known traces, so a clean result does not
    prove that a device is clean, and it does not replace the factory reset
    GL.iNet recommends. Use it at your own risk.
  link: { label: Check your device, url: /security/csa-2026-01/fix/ }
  image: /img/csa-2026-01-fix.svg

community:
  date: 2026-11-21
  notes:
    - title: In a business network, talk to your cyber insurer before you reset
      before: >-
        Running these devices in a business network? A reset destroys logs that
        your insurer or investigators may need.
      text: |
        A factory reset wipes the device, and with it the logs that could show how and since when someone had access. On GL.iNet routers the system log is kept in memory by default, so even a restart clears it.

        If the device runs in a business network and you have cyber insurance or an incident response provider, contact them before you reset it. They may want logs and configuration secured first, and many policies expect you to report an incident before you change affected systems. Until then, disconnect the device from the internet instead of resetting it.
    - title: GL.iNet's quick check only shows what is running right now
      text: |
        The check lists the running processes. It cannot show whether someone had access earlier, or whether something on the device starts the malware again later. /tmp is memory and is empty after a restart, so a clean result on a router that was restarted or unplugged in the meantime says little. Read a clean result as "not running at the moment", not as "never compromised". The factory reset GL.iNet recommends still applies.

        In the same forum thread, two users with a GL-AXT1800 on firmware 4.8.3 report a different process: a loop that connects a root shell to the address 170.39.226.219 through a pipe at /tmp/f. GL.iNet has not said whether this belongs to the incident. If "ps | grep tmp" shows /tmp/f or that address, treat the router as compromised: disconnect it from the internet and contact GL.iNet.
