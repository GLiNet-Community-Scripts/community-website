apps_note: >-
  None of the community apps on this site are named in GL.iNet's notice. A
  factory reset removes installed apps and their settings, so re-run their
  installers afterwards.

community_fix:
  title: Run the community script first
  text: |
    GL.iNet's check looks for one process that is running right now. A community script by Admon runs that check and the wider ones, and also looks at the files on a GL.iNet router or KVM device: the ones this malware is known to leave behind, including the entries that would start it again after a restart. It can save evidence from the device first and, if you ask it to, remove what it found.
  caveat: >-
    Community work, not a GL.iNet tool. GL.iNet has not reviewed or endorsed
    it. The script knows only the known traces, so a clean result does not
    prove that a device is clean, and it does not replace a factory reset or
    GL.iNet's security firmware. Use it at your own risk.
  before: >-
    One command does the checks below for you and more. Run it before you
    restart, reset or update the device: those wipe traces of the attack.
  command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh
  command_variants:
    - { name: curl, command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh }
    - { name: wget, command: wget -q https://app.gl-i.net/csa-2026-01-fix -O gl-helper-triage.sh ; sh gl-helper-triage.sh }
  author: >-
    By Admon and the community: RemoteToHome Consulting and users of
    GL.iNet's forum contributed findings and checks. An independent community
    project.
  does:
    - Runs GL.iNet's check and the wider ones GL.iNet staff recommends
    - Looks at files, autostart entries and the firewall, not only at what is running
    - Only reads. It saves evidence or removes what it found when you ask it to
    - Offers to send a short anonymous report, so everyone sees which devices were hit
  link: { label: How to run it and read the result, url: /security/csa-2026-01/fix/ }
  image: /img/csa-2026-01-fix.svg

community:
  date: 2026-11-21
  notes:
    - title: In a business network, talk to your cyber insurer before you reset
      before: >-
        In a business network, a reset destroys logs that your insurer or
        investigators may need.
      text: |
        A factory reset wipes the device, and with it the logs that could show how someone got access and when it started. On GL.iNet routers the system log is kept in memory by default, so even a restart clears it.

        If the device runs in a business network and you have cyber insurance or an incident response provider, contact them before you reset it. They may want logs and configuration secured first, and many policies expect you to report an incident before you change affected systems. Until then, disconnect the device from the internet instead of resetting it.
    - title: A clean result of GL.iNet's check does not clear a device
      text: |
        GL.iNet's notice says that no cleanup is needed when its check finds nothing. We would not rely on that. The remote shell found on GL-AXT1800 routers does not run the process GL.iNet names: RemoteToHome found the shell on a router where that process was absent. The shell leaves no file behind and is gone after a restart.

        Run the wider checks on this page or the community script. And if a device had GL.iNet's cloud service switched on and has been restarted or updated since the evening of 20 November, no check can clear it for that night.
    - title: If a device was hit, take its keys back at the other end too
      text: |
        The attacker had a root shell, so every key, password and profile stored on the device could be copied. Cleaning or resetting the device does not take those back.

        Remove that access where it is granted: delete the router's VPN profile on the server or with the VPN provider and create a new one, remove SSH keys of the router from every machine that trusts them, and change the Wi-Fi, admin, DDNS and cloud passwords. If the router was itself a VPN server, give it a new key and issue new profiles. RemoteToHome's page has the steps for each kind of VPN.
      link: { label: RemoteToHome's recovery steps, url: "https://github.com/RemoteToHome-io/gl-security-incident-2026#if-you-find-something" }
    - title: Until the security firmware is installed, switch GoodCloud off
      text: |
        GL.iNet says the attack path is blocked on its side. RemoteToHome reports that the unchecked code is still in the router firmware it read, and that the cloud client on the router only starts when GoodCloud is enabled on the device. Switching GoodCloud off in the admin panel therefore takes that code out of play until fixed firmware is installed. The device then disappears from GoodCloud, so make sure you have another way to reach a remote device first.

        This lowers the risk from now on. It does not clean a device that was already hit.
      link: { label: RemoteToHome's commands for switching it off, url: "https://github.com/RemoteToHome-io/gl-security-incident-2026#reducing-exposure-until-fixed-firmware-is-installed" }
    - title: Don't rely on netstat on a device you suspect
      text: |
        GL.iNet's cleanup in the KVM firmware 1.10.2 for the RM1PE removes a netstat that the malware had replaced, and GL.iNet staff says the same can happen on routers and that running the replacement starts the malware. Check /bin/netstat first, as shown under "Check your device".

        The community script reads the list of connections from the system directly and does not call netstat.
    - title: Forum users found a second, older backdoor
      before: >-
        Not part of GL.iNet's notice, and GL.iNet's check does not see it.
      text: |
        While looking for traces of 20 November, users of GL.iNet's forum found a different backdoor on a GL-AX1800 (4.8.3) and a GL-X2000 (4.7.13). On one device its files are dated December 2025, another user says since September 2025. How it got onto the devices is not known. These are user reports; GL.iNet's notice does not mention it.

        Signs: /etc/init.d/urandom_seed has extra lines at the top that mention monitord and ulogd, a file /bin/ulogd exists, /usr/bin/monitord exists, or a process monitord or ujaild is running. It reports the device to adguardns.com or adguardns.org, names that do not belong to AdGuard. It survives a firmware update that keeps settings.

        The community script reports it with its own verdict and does not try to remove it. If you find it, install the firmware again with "keep settings" off, do not restore a backup taken from that device, and change every password and key that was stored on it.
      link: { label: The report in GL.iNet's forum, url: https://forum.gl-inet.com/t/found-other-malware-while-looking-for-11-20-evidence/73097 }
    - title: Thanks to the people doing this work
      text: |
        This page stands on the work of others: RemoteToHome Consulting for the analysis of the remote shell, the KVM firmware and the recovery steps, the forum users kosrkosr and TakashiSasaki for the first reports of the shell, AdamK for the connection checks, ehidle and the other forum users who found and described the older backdoor, and everyone who posted their output in GL.iNet's forum.
      link: { label: RemoteToHome's findings, url: https://github.com/RemoteToHome-io/gl-security-incident-2026 }
