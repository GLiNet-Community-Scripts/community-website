# GL.iNet security notice of 20 November 2026: cloud remote management
# (GoodCloud), routers and KVM devices. What GL.iNet says comes from its notice
# (the blog version updated on 23 November 2026, with the vulnerability reports) and
# from staff posts in its forum.
# What the community found is marked as such, with its source.
id: CSA-2026-01
title: Cloud remote management flaw used to install malware on routers and KVM devices
severity: critical
exploited: true
status: fix-rolling-out
published: 2026-11-21
updated: 2026-11-24T21:34Z
cve: requested
confirmed: gl-inet-public

banner: >-
  GL.iNet's cloud was used to install malware on routers and KVM devices. Check, then install the security firmware. Used GoodCloud? New passwords and keys, even if clean.

summary: >-
  A flaw in GL.iNet’s cloud remote management (GoodCloud) let outsiders send commands to other people’s routers and KVM devices, and they installed malware on some of them. GL.iNet has closed the hole in its cloud and released security firmware that removes the known malware. No update undoes what was already copied off a device, so check yours before you update.

affected:
  summary: >-
    Some GL.iNet routers and KVM devices, reached through GL.iNet's cloud remote management. GL.iNet has not published which models or firmware versions were affected. It lists the models that have security firmware and emails the customers it identifies as affected. The table below shows where traces were reported.
