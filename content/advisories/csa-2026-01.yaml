    more: 1.10.3 for the Comet KVMs, 1.8.7 for the RMQ1. For routers 4.11.1, 4.10.2, 4.9.3 and 4.7.14, model by model.
    tag: Vendor
  - at: 2026-11-22T10:47Z
    text: RemoteToHome has checked 183 of its routers
    more: 152 show the attack, the older backdoor, or both.
    tag: Community
  - at: 2026-11-22T09:34Z
    text: The attacker’s command shows up in GoodCloud’s own log
