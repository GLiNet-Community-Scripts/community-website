apps_note: >-
  None of the community apps on this site are named in GL.iNet's notice. A
  factory reset removes installed apps and their settings, so re-run their
  installers afterwards.

community_fix:
  title: The community built a script that also checks the files on a device
  text: |
    GL.iNet's checks look at what is running right now. A community script by Admon runs the same checks and also looks at the files on a GL.iNet router or KVM device: the ones this malware is known to leave behind, including the entries that would start it again after a restart. It can save evidence from the device first and, if you ask it to, remove what it found.
  caveat: >-
    Community work, not a GL.iNet tool. GL.iNet has not reviewed or endorsed
    it. The script knows only the known traces, so a clean result does not
    prove that a device is clean, and it does not replace the factory reset
    GL.iNet recommends. Use it at your own risk.
  link: { label: Check your device, url: /security/csa-2026-01/fix/ }
  image: /img/csa-2026-01-fix.svg

community:
  date: 2026-11-21
  notes:
    - title: In a business network, talk to your cyber insurer before you reset
      before: >-
        In a business network, a reset destroys logs that your insurer or
        investigators may need.
      text: |
        A factory reset wipes the device, and with it the logs that could show how someone got access and when it started. On GL.iNet routers the system log is kept in memory by default, so even a restart clears it.

        If the device runs in a business network and you have cyber insurance or an incident response provider, contact them before you reset it. They may want logs and configuration secured first, and many policies expect you to report an incident before you change affected systems. Until then, disconnect the device from the internet instead of resetting it.
    - title: On a KVM device, don't rely on netstat
      text: |
        GL.iNet staff's checks for routers use netstat. On KVM devices, GL.iNet's own cleanup in the firmware RM1PE 1.10.2 removes a netstat that the malware had replaced, so on an infected KVM its output may not be trustworthy. We don't know whether the malware does the same on routers.

        The community script reads the list of connections from the system directly and does not call netstat.
