apps_note: >-
  None of the community apps on this site are named in GL.iNet's notice. A factory reset removes installed apps and their settings, so re-run their installers afterwards.

community_fix:
  title: Run the community script first
  text: |
    GL.iNet's check looks for one process that is running right now. The community script runs that check and the wider ones, and also looks at the files the malware leaves behind, including the entries that start it again after a restart. It can save evidence first and, if you ask it to, remove what it found.
  caveat: >-
    Community work, not a GL.iNet tool. GL.iNet has not reviewed or endorsed it. The script knows only the known traces, so a clean result does not prove that a device is clean, and it does not replace a factory reset or GL.iNet's security firmware. Use it at your own risk.
  before: >-
    One command does the checks below for you and more. Run it before you restart, reset or update the device: those wipe traces of the attack.
  command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh
  command_variants:
  - { name: curl, command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh }
  - { name: wget, command: wget -q https://app.gl-i.net/csa-2026-01-fix -O gl-helper-triage.sh ; sh gl-helper-triage.sh }
  author: >-
    By Admon and the community: RemoteToHome Consulting and users of GL.iNet's forum contributed findings and checks. An independent community project.
  does:
  - Runs GL.iNet's check and the wider ones GL.iNet staff recommends
  - Looks at files, autostart entries and the firewall, not only at what is running
  - Only reads. It saves evidence or removes what it found when you ask it to
  - Also finds the older backdoor that forum users discovered
  - Offers to send a short anonymous report, so everyone sees which devices were hit
  link: { label: How to run it and read the result, url: /security/csa-2026-01/fix/ }
  image: /img/csa-2026-01-fix.svg

community:
  date: 2026-11-22
  notes:
  - title: In a business network, talk to your cyber insurer before you reset
    before: >-
      In a business network, a reset destroys logs that your insurer or investigators may need.
    text: |
      A reset wipes the logs that could show how someone got in and when. On GL.iNet routers the system log is kept in memory, so even a restart clears it.

      If you have cyber insurance or an incident response provider, contact them before you reset. Many policies expect a report before affected systems are changed. Until then, disconnect the device from the internet.
  - title: A clean result of GL.iNet's check does not clear a device
    text: |
      GL.iNet's notice says no cleanup is needed when its check finds nothing. We would not rely on that: the remote shell does not run the process GL.iNet names, leaves no file and is gone after a restart.

      Run the wider checks or the community script. If a device had GoodCloud switched on and has been restarted or updated since the evening of 20 November, no check can clear it for that night.
  - title: Prefer a reflash to a factory reset
    before: >-
      A factory reset may not be enough. Reflash the firmware without keeping settings if you can.
    text: |
      GL.iNet says a factory reset addresses the infection. RemoteToHome found that root can write to the firmware image a reset restores from, on most routers it tested. Nobody has reported such a change on a hit device, but a reset cannot rule it out.

      If a device was hit, install the firmware again from a file you downloaded yourself, with "keep settings" off, and set it up by hand instead of restoring a backup.
    link: { label: RemoteToHome's recovery steps, url: "https://github.com/RemoteToHome-io/gl-security-incident-2026#if-you-find-something" }
  - title: If a device was hit, take its keys back at the other end too
    text: |
      The attacker had a root shell, so every key, password and profile on the device could be copied. Cleaning or resetting the device does not take those back.

      Delete the router's VPN profile on the server or with the VPN provider and create a new one, remove its SSH keys from every machine that trusts them, and change the Wi-Fi, admin, DDNS and cloud passwords. If the router was a VPN server, give it a new key and issue new profiles.
    link: { label: RemoteToHome's steps for each kind of VPN, url: "https://github.com/RemoteToHome-io/gl-security-incident-2026#if-you-find-something" }
  - title: Until the security firmware is installed, switch GoodCloud off
    text: |
      GL.iNet says the attack path is blocked on its side. RemoteToHome reports that the unchecked code is still in the router firmware it read, and that the cloud client only runs when GoodCloud is enabled. Switching GoodCloud off in the admin panel takes that code out of play. The device then disappears from GoodCloud, so make sure you can reach a remote device another way first.

      This lowers the risk from now on. It does not clean a device that was already hit.
    link: { label: RemoteToHome's commands for switching it off, url: "https://github.com/RemoteToHome-io/gl-security-incident-2026#reducing-exposure-until-fixed-firmware-is-installed" }
  - title: Don't rely on netstat on a device you suspect
    text: |
      The malware is known to replace netstat, and GL.iNet staff says that running the replacement starts the malware. Check /bin/netstat first, as shown under "Check your device". The community script does not call netstat.
  - title: Forum users found a second, older backdoor
    before: >-
      Forum users found a second, older backdoor that GL.iNet's check does not see.
    text: |
      While looking for traces of 20 November, forum users found a different backdoor, so far on GL-AX1800, GL-X2000, GL-MT3000 and GL-MT2500 routers, on firmware from 4.7.13 to 4.11.0 where the version was given. The files are dated from October 2025 to March 2026, and one user says since September 2025. How it got onto the devices is not known. These are user reports; GL.iNet's notice does not mention it.

      The quickest check compares the start script with the one in the firmware. No output means they are the same: /rom/bin/busybox cmp /etc/init.d/urandom_seed /rom/etc/init.d/urandom_seed

      Other signs: a file /bin/ulogd or /usr/bin/monitord, or a running process monitord or ujaild. It reports the device to servers with look-alike names (adguardns.com, adguardns.org, lede-openproject.org, adxinsight.com, openwrt-project.org) and adds itself to the files a firmware update keeps, so it survives an update that keeps settings.

      The community script reports it and does not try to remove it. If you find it, reflash the firmware with "keep settings" off, do not restore a backup from that device, and change every password and key that was on it.
    link: { label: "The forum thread, with one owner's steps to contain it remotely", url: https://forum.gl-inet.com/t/found-other-malware-while-looking-for-11-20-evidence/73097/6 }
  - title: Thanks to the people doing this work
    text: |
      Admon builds and maintains the community script, the service that collects the anonymous reports, and this page. They stand on the work of others: RemoteToHome Consulting for the analysis of the remote shell, the KVM firmware and the recovery steps, the forum users kosrkosr and TakashiSasaki for the first reports of the shell, AdamK for the connection checks, ehidle, acs, ikangshen, nick2 and the other forum users who found and described the older backdoor, dja for the network logs of an infected KVM, and everyone who sent a report or posted their output in GL.iNet's forum.
    link: { label: RemoteToHome's findings, url: https://github.com/RemoteToHome-io/gl-security-incident-2026 }
