# GL.iNet security notice of 20 November 2026: cloud remote management
# (GoodCloud), routers and KVM devices. What GL.iNet says comes from its notice
# (forum version, last updated 21 November 2026) and from staff posts in its
# forum. What the community found is marked as such, with its source.
id: CSA-2026-01
title: Cloud remote management flaw used to install malware on routers and KVM devices
severity: critical
exploited: true
status: investigating
published: 2026-11-21
updated: 2026-11-22T01:52Z
cve: []
confirmed: gl-inet-public

banner: >-
  A flaw in GL.iNet's cloud remote management was used to install malware on
  some routers and KVM devices. Check your device now, before you restart or
  update it.

summary: >-
  An unauthorized party used a vulnerability in GL.iNet's cloud remote
  management (GoodCloud) to access some GL.iNet routers and KVM devices and
  install malicious software on them. GL.iNet says it fixed the vulnerability
  in its cloud and blocked the attack path, which does not clean devices that
  are already infected. It asks everyone to check their device, and has
  scheduled stable security firmware for 22 November 2026.

affected:
  summary: >-
    A subset of GL.iNet routers and KVM devices, reached through GL.iNet's
    cloud remote management. GL.iNet has not published which models or
    firmware versions; it is emailing affected customers individually. GL.iNet
    staff has listed the models and firmware versions on which traces were
    reported, see the table below.
  products: [Routers, KVM devices (Comet)]
  firmware: Not published
  # From a post by GL.iNet staff in the forum: where traces were reported,
  # not a list of affected devices.
  reported:
    as_of: 2026-11-21T18:45Z
    source:
      label: GL.iNet staff in the forum
      url: https://forum.gl-inet.com/t/quickly-check-if-your-router-is-under-attack/73070/55
    models:
      - { name: Flint 3, sku: GL-BE9300, kind: Router, firmware: [4.10.1] }
      - { name: Flint 2, sku: GL-MT6000, kind: Router, firmware: [4.8.3, 4.9.0] }
      - { name: Brume 3, sku: GL-MT5000, kind: Router, firmware: [4.9.0] }
      - { name: Beryl AX, sku: GL-MT3000, kind: Router, firmware: [4.8.0, 4.8.1] }
      - { name: Brume 2, sku: GL-MT2500, kind: Router, firmware: [4.7.4, 4.7.13] }
      - { name: Slate AX, sku: GL-AXT1800, kind: Router, firmware: [4.8.3] }
      - { name: Mudi 7, sku: GL-E5800, kind: Router, firmware: [4.10.3] }
      - { name: Spitz AX, sku: GL-X3000, kind: Router, firmware: [4.7.4] }
      - { name: Comet, sku: GL-RM1, kind: KVM, firmware: [] }
    note: |
      These are the models and firmware versions with reported traces, as listed by GL.iNet staff in the forum. It is not a list of affected devices from GL.iNet's investigation. If your model or firmware isn't listed, that does not mean it is unaffected.

      According to GL.iNet staff, what matters most is whether GoodCloud was enabled and connected during the attack, not which firmware version the device ran. A device that was powered off throughout could not receive the malicious command. The firmware still matters because the code that handles the command is on the device, and staff does not know yet which router firmware, if any, contains the fix.

# GL.iNet's steps, from its notice as last updated on 21 November 2026.
actions:
  - audience: KVM devices (Comet)
    steps:
      - title: Check the KVM
        text: >-
          In the KVM's web interface open Toolbox, Terminal, Access and run
          "ps -aux | grep tmp" (on the RMQ1 "ps -a | grep tmp"), in the KVM's
          terminal, not on the connected computer. A process with "crond -i
          /tmp/.log" means GL.iNet treats the device as infected.
        link: { label: GL.iNet's notice, url: https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056 }
      - title: If it is infected, reset it or install the security firmware
        text: >-
          GL.iNet says you can restore the device to factory settings to
          address the infection, and still recommends the latest stable
          security firmware.
        link: { label: Reset guide, url: https://docs.gl-inet.com/kvm/en/faq/factory_reset/ }
      - title: If it is infected, check the computer connected to it
        text: >-
          Look for programs, browser extensions or accounts you don't know,
          unexpected startup items or scheduled tasks, changed settings and
          unusual network activity. Run a full scan with up-to-date security
          software.
      - title: Install the stable security firmware
        text: >-
          Scheduled for 22 November 2026. Beta builds with the security fixes
          are available now, 1.10.2 for RM1, RM1V2, RM1PE, RM4PE, RM10 and
          RM10RC, 1.8.6 for RMQ1.
        link: { label: Firmware downloads, url: https://dl.gl-inet.com/ }
  - audience: Routers
    steps:
      - title: Check the router
        text: >-
          Over SSH run "ps | grep tmp", or search the process list in LuCI
          for "tmp/.log". A process with "crond -i /tmp/.log" means GL.iNet
          treats the router as infected.
        link: { label: GL.iNet's notice, url: https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056 }
      - title: If it is infected, reset it or install the security firmware
        text: >-
          GL.iNet says you can restore the router to factory settings to
          address the infection, and still recommends the latest stable
          security firmware. A reset erases your settings and installed apps.
        link: { label: Reset guide, url: "https://docs.gl-inet.com/router/en/4/faq/repair_network_or_reset_firmware/#reset-to-factory" }
      - title: If the check finds nothing
        text: >-
          GL.iNet says no factory reset or other cleanup is needed. The
          community has found cases this check misses. See our note below.
      - title: Install the stable security firmware
        text: Scheduled for 22 November 2026. GL.iNet recommends it for every device.
        link: { label: Firmware downloads, url: https://dl.gl-inet.com/ }

check:
  - title: GL.iNet's check
    text: >-
      If the output contains "crond -i /tmp/.log", the device is infected
      according to GL.iNet. The line with "grep tmp" is the check itself. A
      line with "cat /tmp/f" is the remote shell the community found, so it
      is a hit as well. GL.iNet staff has said that a clean result here is
      not enough, so run the other checks too. On a KVM the command is
      "ps -aux | grep tmp", on the RMQ1 "ps -a | grep tmp".
    command: ps | grep tmp
  - title: The same in the admin panel
    menu: [System, Advanced Settings, LuCI, Status, Processes]
    text: >-
      Search the page (Ctrl+F, on a Mac Cmd+F) for "tmp/.log" and look for
      "crond -i /tmp/.log".
  - title: Processes that remote shells use
    text: >-
      No output is the good result. nc, netcat, socat, "/bin/sh -i" or mkfifo
      in the output need a closer look.
    command: ps ww | grep -E '[n]c |[n]etcat|[s]ocat|[/]bin/sh -i|[m]kfifo'
  - title: The shell's pipe
    text: >-
      The remote shell's pipe /tmp/f stays after the shell was stopped and
      only goes away at a restart. If the line starts with "p", the shell has
      run since the last restart. "No such file" is the good result.
    command: ls -la /tmp/f
  - title: Is netstat still the original?
    text: >-
      GL.iNet staff warns that netstat can be replaced on an infected device
      and that running the replacement starts the malware. On a router the
      line must end in "-> busybox". If it does not, don't run netstat.
    command: ls -l /bin/netstat
  - title: Connections to the reported address
    text: >-
      Only after the check above. The remote shells connect to
      170.39.226.219. Any output here means such a connection is open; the
      last column shows the process and its number (PID). "netstat -tnp"
      without the filter lists all connections: look for ones held by nc,
      netcat, sh or ash.
    command: netstat -tnp | grep '170.39.226.219'

details: |
  On 20 November 2026 GL.iNet identified a vulnerability in its cloud remote management services. According to GL.iNet, an unauthorized party exploited it to access a subset of GL.iNet routers and KVM devices and to install malicious software on them.

  GL.iNet says it fixed the cloud vulnerability and blocked the access used in this incident, so devices can no longer be newly infected through this attack path. It also says these measures do not remove malware from devices that were already infected. It is still determining the scope of the incident, including whether computers connected to affected KVM devices were impacted.

  GL.iNet's notice, as last updated on 21 November, names one sign of an infection: a running process whose details contain "crond -i /tmp/.log". If you find it, GL.iNet says to treat the device as infected; you can restore it to factory settings, and GL.iNet still recommends the latest stable security firmware. If the check finds nothing, GL.iNet says no factory reset or other cleanup is needed, and still recommends the stable security update. If you cannot check or are unsure, GL.iNet asks you to contact support@gl-inet.com.

  Stable security firmware for routers and KVM devices is scheduled for 22 November 2026. For KVM devices, beta builds with security fixes are available now: 1.10.2 for RM1, RM1V2, RM1PE, RM4PE, RM10 and RM10RC, and 1.8.6 for RMQ1. The notice names no router firmware version yet.

  In its forum, GL.iNet staff added that a clean result of the process check is not enough to tell whether a router is compromised. Because users reported remote shells that connect to 170.39.226.219, staff recommends checking the open connections and the running processes as well. Staff also warns that netstat itself can be replaced on an infected device and that running the replacement starts the malware, so check that /bin/netstat is still a link to busybox before you use it. These checks find a remote shell that is running. They cannot show whether a router was compromised earlier or whether something on it starts the malware again.

  If you find such a remote shell, GL.iNet staff says: save the output of "ps ww" and "netstat -tnp", stop the process with "kill -TERM" and its PID (then "kill -KILL" if it is still there), and check that the connection is gone. Don't stop processes you know, such as dropbear or tailscaled. Stopping the shell ends only that session. Treat the router as compromised, disconnect it from the internet and keep the evidence.

  What follows was found by the community, not by GL.iNet. By the afternoon of 21 November there were three reports of the same remote shell, all on a GL-AXT1800 with firmware 4.8.3 and all connected to 170.39.226.219, on a different port each time: two from forum users and one from RemoteToHome Consulting, which found it on one of its own routers. Where the start was measured, it was about 21:40 UTC on 20 November. RemoteToHome reports that GL.iNet's indicator process was not running on that router, that the shell left no file behind, and that its pipe /tmp/f stays until the next restart. So a router that has been restarted or updated since 20 November can pass every check of running processes even if it was hit.

  RemoteToHome also read the code of the GoodCloud client taken from that router (package gl-sdk4-cloud). According to its findings, the client has a handler for an AstroWarp / SD-WAN command from the cloud that puts an address from the cloud message into an iptables command without checking it, so a crafted address runs as a command. It reports that the handler runs whether or not AstroWarp is switched on, and that the same code is in the 4.8.4 beta for the GL-AXT1800 (built 11 November 2026) and in firmware 4.11.0 for the GL-MT3000. GL.iNet has not confirmed this.

  The address the shells connect to is, according to RemoteToHome's look at public registries, a server rented from a US hosting provider, with no customer named. RemoteToHome sent an abuse report to that provider on 21 November at 17:24 UTC.

  For KVM devices, Admon and RemoteToHome compared GL.iNet's firmware images. The 1.10.2 build for the RM1PE deletes the malware's files at boot when it finds them and keeps no copy, so updating an infected RM1PE removes the evidence that it was infected. The 1.10.2 builds for the RM1 and the RM1V2 contain no such cleanup. On an RM1, RemoteToHome found that an update that keeps settings carries over the password file, the SSH keys and everything under /etc/kvmd/user.

  GL.iNet will email affected customers individually, at the address of their GoodCloud account, with guidance for their devices, and says you do not need to wait for that email to check your device or install the update. It says it will update its notice as new information becomes available.

unknowns:
  - Which models and firmware versions were affected, in which time window, and how many devices. GL.iNet has not published this; the table above shows only where traces were reported.
  - Whether the cause RemoteToHome found in the GoodCloud client on the router is right, and which firmware removes it. GL.iNet has not commented.
  - What the malicious software does, and how the process GL.iNet names relates to the "gl-helper" files found on KVM devices.
  - What was run through the remote shells, and whether 170.39.226.219 is the only address involved.
  - How to tell whether a device was compromised earlier. Neither GL.iNet's check nor the community's can show that after a restart.
  - Whether a factory reset is enough or the bootloader (U-Boot) has to be flashed again. GL.iNet staff has raised the question.
  - Whether data such as cloud account details or passwords was exposed. The notice doesn't say.
  - Whether computers connected to affected KVM devices were affected. GL.iNet is still investigating.
  - Whether to keep using cloud remote management until the firmware is out. The notice doesn't say. See our note below.

