# GL.iNet security notice of 20 November 2026: cloud remote management
# (GoodCloud), routers and KVM devices. Based only on GL.iNet's notice on its
# blog and the same notice in the GL.iNet forum.
id: CSA-2026-01
title: Cloud remote management flaw used to install malware on routers and KVM devices
severity: critical
exploited: true
status: investigating
published: 2026-11-21
updated: 2026-11-21T16:35Z
cve: []
confirmed: gl-inet-public

banner: >-
  An attacker used a flaw in GL.iNet's cloud remote management to install
  malware on some routers and KVM devices. GL.iNet recommends a factory reset.

summary: >-
  An unauthorized party used a vulnerability in GL.iNet's cloud remote
  management (GoodCloud) to access some GL.iNet routers and KVM devices and
  install malicious software on them. GL.iNet says it closed the
  vulnerability and is preparing firmware with additional protections. It
  recommends resetting routers and KVM devices to factory settings and
  checking any computer connected to a KVM device.

affected:
  summary: >-
    A subset of GL.iNet routers and KVM devices, reached through GL.iNet's
    cloud remote management. GL.iNet has not published which models or
    firmware versions; it is emailing affected customers individually.
  products: [Routers, KVM devices (Comet)]
  firmware: Not published

actions:
  - audience: KVM devices (Comet)
    steps:
      - title: Reset the KVM to factory settings
        text: >-
          With the device powered on, hold the Reset button for about 10
          seconds, release it and set the device up again.
        link: { label: Reset guide, url: https://docs.gl-inet.com/kvm/en/faq/factory_reset/ }
      - title: Check the computer connected to the KVM
        text: >-
          Look for programs, browser extensions or accounts you don't know,
          unexpected startup items or scheduled tasks, changed settings and
          unusual network activity.
      - title: Scan that computer with up-to-date security software
        text: >-
          If anything looks suspicious, change the passwords of the accounts
          used on it and contact GL.iNet support.
      - title: Install the updated firmware once GL.iNet releases it
  - audience: Routers
    steps:
      - title: Reset the router to factory settings
        text: >-
          After the router has fully started, hold the Reset button for 10
          seconds, release it and set the router up again. This erases your
          settings and installed apps.
        link: { label: Reset guide, url: "https://docs.gl-inet.com/router/en/4/faq/repair_network_or_reset_firmware/#reset-to-factory" }
      - title: Install the updated firmware once GL.iNet releases it

check:
  - title: GL.iNet's first check
    text: >-
      If the output contains "crond -i /tmp/.log", the router is under attack
      according to GL.iNet. A line with "cat /tmp/f" is the remote shell that
      users reported, so it is a hit as well. The line with "grep tmp" is the
      check itself. GL.iNet staff has since said that a clean result here is
      not enough, so run the other checks too.
    command: ps | grep tmp
  - title: The same in the admin panel
    menu: [System, Advanced Settings, LuCI, Status, Processes]
    text: >-
      Search the page (Ctrl+F, on a Mac Cmd+F) for "tmp/.log" and look for
      "crond -i /tmp/.log".
  - title: Connections to the reported address
    text: >-
      Users found remote shells that connect to 170.39.226.219. Any output
      here means such a connection is open. The last column shows the process
      and its number (PID). "netstat -tnp" without the filter lists all
      connections: look for ones held by nc, netcat, sh or ash.
    command: netstat -tnp | grep '170.39.226.219'
  - title: Processes that remote shells use
    text: >-
      No output is the good result. nc, netcat, socat, "/bin/sh -i" or mkfifo
      in the output need a closer look.
    command: ps ww | grep -E '[n]c |[n]etcat|[s]ocat|[/]bin/sh -i|[m]kfifo'
  - title: The shell's pipe
    text: >-
      A user who had the remote shell reports that its pipe /tmp/f stays after
      the shell was stopped and only goes away at a restart. If the line
      starts with "p", the shell has run since the last restart. "No such
      file" is the good result.
    command: ls -la /tmp/f

details: |
  On 20 November 2026 GL.iNet identified a vulnerability in its cloud remote management services. According to GL.iNet, an unauthorized party exploited it to access a subset of GL.iNet routers and KVM devices and to install malicious software on them.

  GL.iNet says it closed the vulnerability in its cloud services right after discovering it and applied corrective measures to the affected devices. It is preparing a firmware release with additional security protections and will publish it as soon as possible. It is still investigating the full scope, including any effect on computers connected to affected KVM devices.

  On 21 November GL.iNet posted a quick check for routers in its forum: a router is under attack when a process "crond -i /tmp/.log" is running. If you find it, or are not sure, GL.iNet asks you to contact support@gl-inet.com or security@gl-inet.com.

  Later that day GL.iNet staff added in the same thread that a clean result of this check is not enough to tell whether a router is compromised. Because users reported remote shells that connect to 170.39.226.219, staff recommends checking the open connections and the running processes as well. These checks find a remote shell that is running. They cannot show whether a router was compromised earlier or whether something on it starts the malware again.

  If you find such a remote shell, GL.iNet staff says: save the output of "ps ww" and "netstat -tnp", stop the process with "kill -TERM" and its PID (then "kill -KILL" if it is still there), and check that the connection is gone. Don't stop processes you know, such as dropbear or tailscaled. Stopping the shell ends only that session. Treat the router as compromised, disconnect it from the internet, keep the evidence and follow GL.iNet's remediation instructions, which staff says are still to come.

  By the afternoon of 21 November, three users in that thread had reported the same remote shell, all on a GL-AXT1800 with firmware 4.8.3 and all connected to 170.39.226.219, on a different port each time. Two of them measured when it started: about 21:40 UTC on 20 November. One of the three found none of it on disk afterwards, and another reports that it was gone after a restart. So a router that has been restarted or updated since 20 November can pass every check of running processes even if it was hit.

  The third user also looked for the cause. According to their analysis, the GoodCloud client on the router (package gl-sdk4-cloud) has a handler for an AstroWarp / SD-WAN command from the cloud that puts an address from the cloud message into an iptables command without checking it, so a crafted address runs as a command. They report that the handler also runs when AstroWarp is switched off, and that it is the same in firmware 4.8.4. This is one user's analysis. GL.iNet has not confirmed it.

  That user's advice after a hit: treat every secret stored on the router as exposed, including VPN keys and configurations, Wi-Fi passwords and the admin password.

  GL.iNet will email affected customers individually, at the address of their cloud account, with guidance for their devices. If you are not sure whether your device is affected, contact GL.iNet support; they will help you check it. GL.iNet says it will update its notice as new information becomes available.

unknowns:
  - Which models and firmware versions were affected. GL.iNet has not published a list. The user reports so far all concern the GL-AXT1800 with firmware 4.8.3.
  - Whether the cause one user found, a handler in the GoodCloud client on the router, is right, and which firmware versions contain it. GL.iNet has not commented.
  - What the malicious software does. GL.iNet has named one sign, a running process, but no technical details.
  - How to tell whether a router was compromised earlier or has something on it that starts the malware again. GL.iNet staff says the checks so far can't show that.
  - Whether a factory reset is enough or the bootloader (U-Boot) has to be flashed again. GL.iNet staff has raised the question.
  - The remediation instructions for a router with a remote shell. GL.iNet staff says they are still to come.
  - Whether data such as cloud account details or passwords was exposed. The notice doesn't say.
  - Whether computers connected to affected KVM devices were affected. GL.iNet is still investigating.
  - When the updated firmware comes out, and for which models.
  - Whether to keep using cloud remote management until then. The notice doesn't say.

