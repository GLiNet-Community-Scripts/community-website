    note: |
      These are anonymous, unverified reports from people who ran the community script, and some devices were scanned more than once. A model and firmware with reports from at least five devices are added automatically, within a quarter of an hour; the others we add by hand. It is not a list of affected devices from GL.iNet's investigation, and a model or firmware that is missing here is not thereby unaffected. GL.iNet staff posts the same list in its forum.

      According to GL.iNet staff, what matters most is whether GoodCloud was enabled and connected during the attack, not the firmware version. The firmware still matters because the code that handles the command is on the device, and staff does not know yet which router firmware contains the fix.

# GL.iNet's steps, from its notice as last edited on 23 November 2026. The page shows the
# guide below instead; these go into the RSS feed.
actions:
- audience: KVM devices (Comet)
  steps:
  - title: Install the stable security firmware
    text: >-
      1.10.3 or later for RM1, RM1V2, RM1PE, RM4PE, RM10 and RM10RC, 1.8.7 or later for the RMQ1. GL.iNet says the update removes the malware without a factory reset, and that you can keep your settings.
    link: { label: GL.iNet's notice, url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20 }
  - title: Check the KVM
    text: >-
      In the KVM's web interface open Toolbox, Terminal, Access and run "ps -aux | grep tmp" (on the RMQ1 "ps -a | grep tmp"), in the KVM's terminal, not on the connected computer. A process with "crond -i /tmp/.log" means GL.iNet treats the device as infected. GL.iNet says this check may not detect every affected device.
  - title: If it is infected, check the computer connected to it
    text: >-
      Look for programs, browser extensions or accounts you don't know, unexpected startup items or scheduled tasks, changed settings and unusual network activity. Run a full scan with up-to-date security software.
- audience: Routers
  steps:
  - title: Install the stable security firmware
    text: >-
      Out for 18 models; the notice names the version for each. GL.iNet says the update removes the malware without a factory reset, and that you can keep your settings. If your model is not listed, look in the download center or write to support.
    link: { label: GL.iNet's notice, url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20 }
  - title: Check the router
    text: >-
      Over SSH run "ps | grep tmp", or search the process list in LuCI for "tmp/.log". A process with "crond -i /tmp/.log" means GL.iNet treats the router as infected. GL.iNet says this check may not detect every affected device.
  - title: If the check finds nothing
    text: >-
      GL.iNet says no factory reset or other cleanup is needed, and still recommends the update. For a wider check its notice names the community script, as a third-party tool it has not verified.
  - title: If the sign is still there after the update
    text: Write to support@gl-inet.com. The same goes when the update fails.

# The long form of the page. In these texts a path, a command, an option or an address
# stands between backticks; the page sets it in a monospace face. Figures from the anonymous
# reports: export of 23 November 2026, 21:03 UTC.
guide:
  glance:
    - label: Status
      value: Firmware is out
      note: For 18 router and 7 KVM models, by GL.iNet’s notice of 23 Nov
    - label: In the reports
      value: 2,365 devices
      note: 2,018 routers, 347 KVM devices
    - label: Routers with traces
      value: 43 %
      note: 705 of 1,632 not yet updated
    - label: KVM devices with traces
      value: 49 %
      note: 127 of 258 not yet updated
  glance_note: Anonymous reports of the community script, 23 Nov 2026, 21:03 UTC. Unverified, and only from people who chose to send one.
  steps:
    - audience: Router
      steps:
        - title: Check the device
          text: Run the community script over SSH. It only reads, and it takes a minute.
          command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh
          why:
            - GL.iNet’s own check looks for one running process. The remote shell does not run that process, leaves no file and is gone after a restart. GL.iNet’s notice now says itself that its quick checks may not detect every affected device.
            - The script runs GL.iNet’s check and also looks at files, autostart entries and the firewall. GL.iNet’s notice names it as an optional third-party check that GL.iNet has not verified. No SSH? Use the checks by hand further down.
        - title: Save what it finds
          text: If the script reports traces, run it again with `--archive` before you change anything.
          command: sh gl-helper-triage.sh --archive
          why:
            - A restart removes the remote shell. A reset wipes the logs. The security firmware deletes known traces at its first start.
            - In a business network, talk to your cyber insurer or incident response provider first. Many policies expect a report before affected systems are changed.
        - title: Switch GoodCloud and AstroWarp off
          text: Use the GoodCloud switch in the admin panel. Leave it off until the security firmware is installed, and look again after every upgrade.
          why:
            - The flaw sat in the cloud client on the device. It could be used whenever that client ran, with AstroWarp on or off. One owner reports that an upgrade switched the client back on.
            - Switching it off lowers the risk from now on. It does not clean a device that was already hit. The device disappears from GoodCloud, so make sure you can reach a remote device another way.
        - title: Install the security firmware
          text: GL.iNet’s notice names the version for each model. GL.iNet says the update removes the malware and that you can keep your settings. If the device was hit, we would still reflash from a file you downloaded yourself, with “keep settings” off.
          why:
            - The version number alone does not show the fix. Older builds of 4.8.4, 4.9.1, 4.10.3 and 4.11.1 exist, and the reports show traces on some of them. The security builds are dated 22 or 23 November 2026.
            - Your model is not on the list? GL.iNet says that this does not make it unaffected. Look in its download center or write to support@gl-inet.com. Do not install firmware for another model. If you installed a security beta, GL.iNet says to move to the stable firmware.
            - "Why reflash a device that was hit: the update deletes the known files and autostart entries. It leaves the older backdoor’s programs, and anything else that was changed. A factory reset restores from an image that root can change on most models. A reflash does not."
          table:
            caption: Security firmware by model, from GL.iNet’s notice of 23 November. Each version or a later one.
            rows:
              - k: 4.11.1
                v: GL-MG1300, GL-MT3000, GL-MT6000
              - k: 4.10.3
                v: GL-E5800
              - k: 4.10.2
                v: GL-BE3600, GL-BE9300
              - k: 4.9.3
                v: GL-BE14000
              - k: 4.9.1
                v: GL-BE6500, GL-MT3600BE, GL-MT5000
              - k: 4.8.7
                v: GL-BE10000
              - k: 4.8.4
                v: GL-AX1800, GL-AXT1800, GL-SFT1200, GL-X3000, GL-XE3000
              - k: 4.7.14
                v: GL-MT2500, GL-MT2500A, GL-X2000
          link:
            label: GL.iNet’s notice, with the download for each model
            url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20
        - title: "If it was hit: new keys and passwords"
          text: VPN profiles, SSH keys, and the Wi-Fi, admin, DDNS and cloud passwords.
          why:
            - The attacker had a root shell. Everything stored on the device could be copied, and cleaning the device does not take that back.
            - "Delete the router’s VPN profile at the other end and create a new one. Export the device log from your GoodCloud account before you change that password: it may show the attacker’s command."
    - audience: KVM (Comet)
      steps:
        - title: Check the KVM
          text: Open Toolbox, Terminal in the KVM’s web interface and run the script there, not on the connected computer.
          command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh
          why:
            - GL.iNet’s check is `ps -aux | grep tmp`, on the RMQ1 `ps -a | grep tmp`. A process `crond -i /tmp/.log` means GL.iNet treats the device as infected.
            - The script runs this check and looks at the files too.
        - title: Save what it finds
          text: If the script reports traces, run it again with `--archive` before you update.
          command: sh gl-helper-triage.sh --archive
          why:
            - The security firmware removes the malware’s files. For the RM1PE the firmware itself shows that it keeps no copy. After the update nothing tells that the device was infected.
        - title: Switch the cloud service off
          text: In the KVM’s settings, until the security firmware is installed.
          why:
            - The command came over the cloud connection. With the service off it cannot arrive.
        - title: Install the security firmware, then reset
          text: Version 1.10.3 or later, 1.8.7 or later for the RMQ1. GL.iNet says no reset is needed. If the KVM was hit, we would reset it to factory settings afterwards.
          why:
            - An update that keeps settings also keeps the password file, the SSH keys and everything under `/etc/kvmd/user`. The malware’s installer can add an SSH key of its own.
          link:
            label: GL.iNet’s notice, with the download for each model
            url: https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20
        - title: Check the computer behind it
          text: Look for programs, browser extensions, accounts and startup items you do not know. Run a full scan.
          why:
            - A KVM controls the keyboard and the screen of the computer it is attached to. GL.iNet is still investigating whether such computers were affected.
  risk:
    - title: GoodCloud was switched on
      text: "Of 100 such routers in the reports, 60 show traces. With GoodCloud off: 20."
    - title: Router firmware 4.7 to 4.10
      text: "On 4.7 to 4.9, seven to eight routers in ten show traces. On 4.10, about half. On 4.6 and older, and on 4.11: none."
    - title: Restarted or updated since 20 November
      text: Then a clean check says little. The remote shell leaves no file, and the security firmware deletes known traces.
  table_help:
    - These are anonymous, unverified reports, and some devices were checked more than once. It is not GL.iNet’s list of affected devices.
    - A model that is missing is not thereby safe.
    - A model and firmware with reports from five devices are added automatically. The others we add by hand.
  topics:
    - title: What GL.iNet says
      source: GL.iNet
      lead: The cloud is fixed, security firmware is out, and its own quick check may miss devices.
      body:
        - On 20 November 2026 GL.iNet found a vulnerability in its cloud remote management. An outsider used it to get into some routers and KVM devices and to install malware.
        - GL.iNet fixed its cloud and blocked the access. It says devices can no longer be newly infected along this path. That alone does not clean a device that is already infected.
        - Since 23 November the notice lists stable security firmware for 18 router models and 7 KVM models. GL.iNet says the update removes the malware without a factory reset, and that you can keep your settings. It recommends the update for every device, also when the check finds nothing.
        - "The notice names one sign of an infection: a running process `crond -i /tmp/.log`. It now adds that more signs have been found, and that its quick checks may not detect every affected device. For a wider check it names the community script, as a third-party tool that GL.iNet has not verified or endorsed."
        - GL.iNet emails the customers it identifies as affected, at the address of their cloud account. It is still working out the scope, including whether computers behind a KVM were affected.
        - "Staff added in the forum: check open connections and running processes too, and do not trust `netstat` on a device that may be infected."
    - title: The way in
      source: Community
      lead: The cloud client put values from the cloud into shell commands without checking them.
      body:
        - The cloud client on the device has a handler for AstroWarp. It took values from a cloud message and put them into shell commands unchecked. Whoever could send such a message could run any command as root, with AstroWarp on or off.
        - RemoteToHome found this first, in the client of a router that had been hit. The code is in firmware from 4.7.0 (5 December 2024) on. 4.6 does not have it, and no router on 4.6 or older shows a trace.
        - Admon compared firmware 4.9.2 and 4.9.3 for the GL-BE14000. The new firmware checks and quotes these values. Eight cloud functions now refuse input with shell syntax.
        - GL.iNet has not confirmed that this was the way in.
    - title: How the attack may have run
      source: Our reading
      lead: "It looks like a schedule: model by model, each within about a minute."
      body:
        - This is our reading of the anonymous reports, not a finding of GL.iNet’s investigation. We are a handful of volunteers, and we see only what people chose to send.
        - In the reports, the routers of one model carry almost the same time. The next model follows 9 to 14 minutes later.
        - "@sweep"
        - The time is the last write to a file the attack leaves behind. A later command overwrites an earlier one, so the first command may have come sooner.
        - If this is right, whoever sent the commands knew the model of each device beforehand. The cloud knows it, and the malware’s installer names eleven router models.
        - On most devices a command ran and nothing else was found. 56 devices had a remote shell. The last trace in the reports dates from 21 November, 18:58 UTC.
    - title: What the reports show
      source: Reports
      lead: 2,365 devices. The share with traces depends on the firmware.
      body:
        - 2,018 routers and 347 KVM devices have sent a report. 386 of the routers and 89 of the KVM devices already run the security firmware and report clean. Of the other routers, 43 percent show traces of the attack. Of the other KVM devices, 49 percent do.
        - "@series"
        - Nobody knows why 4.11 shows no traces. The unchecked code is in 4.11.0 too, so this does not show that 4.11 was safe.
        - A device on the security firmware reports clean, also where it showed traces before. We saw 43 routers and 20 KVM devices with traces before their update, and all of them report clean after it. That is why updated devices are left out of the shares here.
    - title: The remote shell
      source: Community
      lead: A root shell that leaves no file and is gone after a restart.
      body:
        - Forum users and RemoteToHome found a remote root shell on routers. It connected to `170.39.226.219`, on a different port each time, from about 21:40 UTC on 20 November.
        - The shell leaves no file. Its pipe `/tmp/f` is gone after a restart. A router that was restarted or updated since can pass every check of running processes even if it was hit.
        - The server was rented. After RemoteToHome’s abuse report the hosting provider suspended it on 21 November and preserved it for an investigation.
    - title: The malware and its installer
      source: Community
      lead: "`gl-helper`, its helper `gb`, and how they survive a restart."
      body:
        - A forum user fetched the installer and read it with an AI tool. The file names and addresses decode as stated. We have not verified the description of what it does.
        - The installer puts `gl-helper` and a helper named `gb` into `/etc/glinet/.cache`. If it cannot write there, it uses `/etc/gl_nas/.cache`, `/userdata/.gl`, `/overlay/.gl` or `/tmp/.gl`. It keeps a copy in `/etc/config/.gl`, because that directory survives a firmware update that keeps settings.
        - It adds itself to `/etc/rc.local` and to the crontab. A script named `watch.sh` puts everything back every three minutes. `crond -i /tmp/.log`, the process GL.iNet’s check looks for, is the name the malware gives its own process.
        - Other options set the dates of its files back, add an SSH key named `gl-agent`, and point the remote terminal service at the attacker’s server `65.20.71.131`. The files come from `66.245.219.252`.
    - title: KVM devices
      source: Community
      lead: Hit a day earlier, and some firmware deletes the evidence.
      body:
        - One forum user recorded a GL-RM1 being taken over on 19 November at 02:35 UTC, a day before the date in GL.iNet’s notice. It connected to `65.20.71.131`, fetched files from `66.245.219.252` and looked up `gl-inet.top`, a name that was registered anew on 16 November.
        - Firmware 1.10.2 for the RM1PE deletes the malware’s files at boot and keeps no copy. The 1.10.2 builds for the RM1 and RM1V2 have no such cleanup.
        - The stable security firmware is 1.10.3, and 1.8.7 for the RMQ1. GL.iNet says it removes the malware.
    - title: The security firmware
      source: Community
      lead: It closes the flaw and deletes known traces at its first start.
      body:
        - GL.iNet says the update removes the malware of this incident without a factory reset. A comparison of the old and the new firmware shows what it does.
        - The router firmware cleans up once, at its first start. Where `/etc/config/.gl` exists, it deletes that directory, the malware’s line in `/etc/rc.local` and its cron lines. It always restores `/etc/init.d/urandom_seed`.
        - It leaves the scripts in `/etc/glinet/.cache`, does nothing when `/etc/config/.gl` is missing, and does not remove the older backdoor’s programs.
        - So check first, then update, then check again.
    - title: A trace on GL.iNet’s side
      source: Community
      lead: The device log in your GoodCloud account may show the attacker’s command.
      body:
        - The device log that you can export from a GoodCloud account shows responses that contain `astrowarp` with the id 1. Ordinary commands carry an id of 32 characters.
        - One user found such a response for a GL-BE14000 in the same second as the trace on the router. GL.iNet keeps this log, so it survives a restart.
        - Export it before you change the GoodCloud password. One owner reports that it was gone afterwards. We have not checked this ourselves.
    - title: Update, reset or reflash?
      source: Community
      lead: GL.iNet says the update is enough. For a device that was hit, a reflash is the surer way.
      body:
        - GL.iNet’s notice of 23 November says the security firmware removes the malware without a factory reset, and that settings can be kept. Earlier versions of the notice named a factory reset.
        - "The firmware comparison shows what the update deletes: the known files and autostart entries. It leaves the older backdoor’s programs. And no update takes back keys and passwords that were copied."
        - RemoteToHome tested several routers. On most models root can write to the stored firmware image, and in further tests to the boot area as well. A factory reset restores from that image and would keep such a change. Nobody has reported such a change on a hit device.
        - So for a device that was hit, RemoteToHome advises a full reflash without keeping settings. So do we.
