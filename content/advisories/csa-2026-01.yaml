    - hour: 2026-11-21T05
      n: 89
    - hour: 2026-11-21T06
      n: 204
    - hour: 2026-11-21T07
      n: 7
    - hour: 2026-11-21T08
      n: 1
    - hour: 2026-11-21T11
      n: 3
    - hour: 2026-11-21T18
      n: 2
  hours_note: "Bars: routers hit per hour, by the time of the trace the attack leaves. 704 routers, reports up to 23 Nov, 21:03 UTC."
  backdoor:
    lead: While they looked for traces of 20 November, forum users found a different backdoor. GL.iNet’s check does not see it. The community script does.
    rows:
      - label: Where
        text: 96 devices in the reports, 53 of them GL-MT2500. Also GL-MT6000, GL-X3000, GL-AX1800 and others.
      - label: Since when
        text: Its files are dated from September 2025 to May 2026. How it got onto the devices is not known.
      - label: What it can do
        text: It turns the device into a proxy, also into the network behind it. It gives a root shell, runs commands and drops files. This comes from one researcher’s analysis, which we have not verified.
      - label: Signs
        text: A file `/bin/ulogd` or `/usr/bin/monitord`, or a running process `monitord` or `ujaild`.
      - label: What to do
        text: Reflash with “keep settings” off. Do not restore a backup from that device. Change every password and key that was on it.
    command: /rom/bin/busybox cmp /etc/init.d/urandom_seed /rom/etc/init.d/urandom_seed
    command_note: Quick check. No output means the start script is the firmware’s own.
    note: "GL.iNet’s security firmware puts the start script back and leaves the programs: on eight devices in the reports its file is still there after the update. GL.iNet’s notice does not mention this backdoor. The community script reports it and does not remove it."
  questions:
    - group: The attack
      items:
        - q: Has the wave of new attacks ended?
          status: likely
          a: No report shows a new command after 21 November, 18:58 UTC, among 2,365 devices. GL.iNet says devices can no longer be newly infected along this path. RemoteToHome said on 22 November that it still saw routers being exploited.
        - q: Is the attacker off the devices that were hit?
          status: no
          a: "On routers that were not restarted, the remote shell keeps trying to connect: 29 devices showed that on 22 and 23 November. A restart ends it. What was installed or copied before stays."
        - q: When did it start?
          status: open
          a: GL.iNet names 20 November. One KVM was taken over on 19 November.
        - q: Was the AstroWarp flaw the way in?
          status: likely
          a: The security firmware changes exactly that code. GL.iNet has not said so.
        - q: Were the other cloud functions used?
          status: open
          a: Eight took unchecked input. A trace is known for one of them.
        - q: What ran through the remote shells?
          status: open
          a: Nobody outside knows, nor which other addresses are involved.
        - q: What does `gl-helper` do once it runs?
          status: open
          a: The installer has been read. The program itself has not.
    - group: Your device
      items:
        - q: Which models and versions were affected?
          status: open
          a: GL.iNet has not published a list. Its notice lists the models that have security firmware, and says that a model missing there is not thereby unaffected. The table above shows only where traces were reported.
        - q: Why does firmware 4.11 show no traces?
          status: open
          a: Not known. The unchecked code is in 4.11.0 too.
        - q: Was a device at risk with remote access off?
          status: likely
          a: "By the code, yes: being bound to GoodCloud was enough. GL.iNet has not said."
        - q: Can I tell whether it was hit earlier?
          status: no
          a: Not after a restart.
        - q: Is the update enough for a device that was hit?
          status: disputed
          a: GL.iNet says the security firmware removes the malware and that settings can be kept. It deletes the known files. It leaves the older backdoor’s programs, it does not take back copied keys, and RemoteToHome found that root can change the stored firmware image.
    - group: Beyond the device
      items:
        - q: Were account details or passwords exposed?
          status: open
          a: The notice does not say.
        - q: Could the attacker reach GoodCloud itself?
          status: open
          a: For example its WireGuard service. Only GL.iNet can answer that.
        - q: Were computers behind a KVM affected?
          status: open
          a: GL.iNet says it is still working that out.
        - q: Does the older backdoor belong to this incident?
          status: open
          a: GL.iNet’s firmware restores the start script it changes. The notice speaks of more signs that were found and does not name them.
  checks:
    - title: GL.iNet’s check
      command: ps | grep tmp
      good: Only the line with `grep tmp` itself.
      bad: "A line with `crond -i /tmp/.log`: GL.iNet treats the device as infected. A line with `cat /tmp/f`: the remote shell."
      note: "On a KVM: `ps -aux | grep tmp`. On the RMQ1: `ps -a | grep tmp`. GL.iNet’s notice says itself that this check may not detect every affected device."
    - title: Processes that remote shells use
      command: ps ww | grep -E '[n]c |[n]etcat|[s]ocat|[/]bin/sh -i|[m]kfifo'
      good: No output.
      bad: "`nc`, `netcat`, `socat`, `/bin/sh -i` or `mkfifo`. Look closer."
    - title: The trace that survives a restart
      command: ls -la /etc/mp_ip_mapping_info
      good: "`No such file`."
      bad: The file exists, its size is 0, and it is dated 20 November 2026 or later, on a router where you do not use AstroWarp. Then a command from the attacker ran.
      note: "The only check here that still works after a restart. On the security firmware an empty file from after the update is harmless: the firmware can write it itself."
    - title: The shell’s pipe
      command: ls -la /tmp/f
      good: "`No such file`."
      bad: The line starts with `p`. The shell has run since the last restart.
    - title: Is `netstat` still the original?
      command: ls -l /bin/netstat
      good: The line ends in `-> busybox`.
      bad: Anything else. The device is infected, and `netstat` hides connections.
      note: Do this before you run `netstat`. The malware replaces it, and GL.iNet staff says that running the replacement starts the malware.
    - title: Connections to the reported address
      command: netstat -tnp | grep '170.39.226.219'
      good: No output.
      bad: Any line. Such a connection is open, and the last column names the process.
      note: Only after the check before this one.
  checks_note: "In the admin panel instead: System, Advanced Settings, LuCI, Status, Processes. Search the page for `tmp/.log`."
  thanks:
    names:
      - Admon
      - RemoteToHome Consulting
      - kosrkosr
      - TakashiSasaki
      - AdamK
      - ehidle
      - acs
      - ikangshen
      - nick2
      - dja
      - rdizzie
      - UnhappyCloud
      - Romer
      - osi
      - joska252
      - infinisec
      - SaadEGI
    note: And everyone who sent a report or posted their output in GL.iNet’s forum.
  ai_note: "This page was written by an AI model. It rests on what the community sees and has been working on since the incident began: the anonymous reports, the forum and the firmware."
  steps_note: The script is community work, not a GL.iNet tool. GL.iNet’s notice names it as an optional third-party check that it has not verified or endorsed.

