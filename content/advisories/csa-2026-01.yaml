# GL.iNet security notice of 20 November 2026: cloud remote management
# (GoodCloud), routers and KVM devices. What GL.iNet says comes from its notice
# (forum version, last updated 21 November 2026) and from staff posts in its
# forum. What the community found is marked as such, with its source.
id: CSA-2026-01
title: Cloud remote management flaw used to install malware on routers and KVM devices
severity: critical
exploited: true
status: investigating
published: 2026-11-21
updated: 2026-11-22T02:35Z
cve: []
confirmed: gl-inet-public

banner: >-
  A flaw in GL.iNet's cloud remote management was used to install malware on some routers and KVM devices. Check your device now, before you restart or update it.

summary: >-
  An unauthorized party used a vulnerability in GL.iNet's cloud remote management (GoodCloud) to access some GL.iNet routers and KVM devices and install malicious software on them. GL.iNet says it fixed the vulnerability in its cloud and blocked the attack path, which does not clean devices that are already infected. It asks everyone to check their device, and has scheduled stable security firmware for 22 November 2026.

