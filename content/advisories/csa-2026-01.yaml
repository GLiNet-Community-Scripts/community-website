  backdoor:
    lead: While looking for traces from November 20, forum users found a different backdoor. GL.iNet’s check does not detect it. The community script does.
    rows:
      - label: Where
        text: 96 devices in the reports, 53 of them GL-MT2500. Also GL-MT6000, GL-X3000, GL-AX1800 and others. RemoteToHome found it on 49 of the routers it manages.
      - label: Since when
        text: Its files are dated from September 2025 to May 2026. How it got onto the devices is not known.
      - label: What it can do
        text: Its second program runs only in memory. Whoever controls its server can run any command, write any file and use the router as a doorway into the network behind it. RemoteToHome took apart both builds found on its routers. In their memory it found only check-ins, no commands and no traffic through the doorway.
      - label: Signs
        text: "A file `/bin/ulogd` or `/usr/bin/monitord`, a running process `monitord` or `ujaild`, or one of its server names in the configuration: `adguardns.com`, `adguardns.org`, `adsanalypro.com`, `lede-openproject.org`, `adxinsight.com`, `openwrt-project.org`."
      - label: What to do
        text: Reflash with “keep settings” off, from a file you downloaded yourself. Do not restore a backup from that device. Until then, take it off the internet or block its server names. Change every password and key that was on it.
    command: /rom/bin/busybox cmp /etc/init.d/urandom_seed /rom/etc/init.d/urandom_seed
    command_note: Quick check. No output means the start script is the firmware’s original.
    note: "GL.iNet’s security firmware restores the start script but leaves the loader `/bin/ulogd`: on eight devices in the reports it is still there after the update. In RemoteToHome’s test, the backdoor’s own entry in the keep list carried it through an update with settings kept, and it no longer started. GL.iNet’s notice now lists it as a separate finding whose way in is not known, and says not to assume that its cleanup resolves it. The community script reports it and does not remove it."
  questions:
    - group: The attack
      items:
        - q: Has the wave of new attacks ended?
          status: likely
          a: No report shows a new command after November 21, 18:58 UTC, among 2,365 devices. GL.iNet says devices can no longer be newly infected along this path. RemoteToHome said on November 22 that it still saw routers being exploited.
        - q: Is the attacker off the devices that were hit?
          status: no
          a: "On routers that were not restarted, the remote shell keeps trying to connect: 29 devices showed that on November 22 and 23. A restart ends it. Whatever was installed or copied before that stays."
        - q: When did it start?
          status: open
          a: GL.iNet says November 20. One KVM was taken over on November 19.
        - q: Was the AstroWarp flaw the way in?
          status: likely
          a: GL.iNet’s notice of November 23 names it, together with the error in its cloud that let the message reach the device.
        - q: Were the other cloud functions used?
          status: open
          a: Eight accepted unchecked input. A trace is known for only one of them.
        - q: What ran through the remote shells?
          status: open
          a: "RemoteToHome recovered 106 of them from its routers’ memory: no download command was typed into any of them. The commands that came through the cloud looked for the KVM malware’s folders, opened the shell, ended it and called the malware’s server. None installed anything. Routers that were restarted are not in this count."
        - q: What does `gl-helper` do once it runs?
          status: open
          a: The installer and the helper `gb` have been read. `gl-helper` itself is packed, and nobody has published what is inside.
    - group: Your device
      items:
        - q: Which models and versions were affected?
          status: open
          a: GL.iNet has not published a list. Its notice lists the models that have security firmware, and says that a model missing there is not necessarily unaffected. The table above shows only where traces were reported.
        - q: Why does firmware 4.11 show no traces?
          status: open
          a: Not known. The unchecked code is in 4.11.0 too.
        - q: Was a device at risk with remote access off?
          status: likely
          a: "Going by the code, yes: being bound to GoodCloud was enough. GL.iNet says the AstroWarp flaw worked with AstroWarp off, and that a device connected to GoodCloud could have been exposed."
        - q: Can I tell whether it was hit earlier?
          status: no
          a: Not after a restart.
        - q: Is the update enough for a device that was hit?
          status: no
          a: Not with the settings kept, in our view. GL.iNet now calls a reinstall without settings the strongest recovery, and says that keeping them gives less certainty. The update deletes the known files. It leaves the older backdoor’s loader and other added entries, and it does nothing about keys that were already copied.
    - group: Beyond the device
      items:
        - q: Were account details or passwords exposed?
          status: open
          a: GL.iNet has not confirmed access to other devices through a hit device. It says root access can expose what is stored on the device, and advises new passwords and keys for every device that was connected to GoodCloud.
        - q: Could the attacker reach GoodCloud itself?
          status: open
          a: For example its WireGuard service. Only GL.iNet can answer that.
        - q: Were computers behind a KVM affected?
          status: open
          a: GL.iNet says it is still working that out.
        - q: Does the older backdoor belong to this incident?
          status: open
          a: Not known. GL.iNet’s notice lists it as a separate finding, whose way in and link to this incident are not established. Its firmware restores the start script the backdoor changes.
  checks:
    - title: GL.iNet’s check
      command: ps | grep tmp
      good: Only the line with `grep tmp` itself.
      bad: "A line with `crond -i /tmp/.log`: GL.iNet treats the device as infected. A line with `cat /tmp/f`: the remote shell."
      note: "On a KVM: `ps -aux | grep tmp`. On the RMQ1: `ps -a | grep tmp`. GL.iNet itself says that this check has limited coverage, and its notice no longer lists it for routers."
    - title: Processes that remote shells use
      command: ps ww | grep -E '[n]c |[n]etcat|[s]ocat|[/]bin/sh -i|[m]kfifo'
      good: No output.
      bad: "`nc`, `netcat`, `socat`, `/bin/sh -i` or `mkfifo`. Look closer."
    - title: The trace that survives a restart
      command: ls -la /etc/mp_ip_mapping_info
      good: "`No such file`."
      bad: The file exists, its size is 0, and it is dated November 20, 2026 or later, on a router where you do not use AstroWarp. That means a command from the attacker ran.
      note: "The only check here that still works after a restart. On the security firmware, an empty file dated after the update is harmless: the firmware can create it itself."
    - title: The shell’s pipe
      command: ls -la /tmp/f
      good: "`No such file`."
      bad: The line starts with `p`. The shell has run since the last restart.
    - title: Is `netstat` still the original?
      command: ls -l /bin/netstat
      good: The line ends in `-> busybox`.
      bad: Anything else. The device is infected, and `netstat` hides connections.
      note: Do this before you run `netstat`. The malware replaces it, and GL.iNet staff says that running the replacement starts the malware.
    - title: Connections to the reported address
      command: netstat -tnp | grep '170.39.226.219'
      good: No output.
      bad: Any line. Such a connection is open, and the last column names the process.
      note: Only after the previous check.
  checks_note: "Or in the admin panel: System > Advanced Settings > LuCI > Status > Processes. Search the page for `tmp/.log`."
