      According to GL.iNet staff, what matters most is whether GoodCloud was enabled and connected during the attack, not the firmware version. The firmware still matters because the code that handles the command is on the device, and staff does not know yet which router firmware contains the fix.

# GL.iNet's steps, from its notice as last updated on 21 November 2026.
actions:
- audience: KVM devices (Comet)
  steps:
  - title: Check the KVM
    text: >-
      In the KVM's web interface open Toolbox, Terminal, Access and run "ps -aux | grep tmp" (on the RMQ1 "ps -a | grep tmp"), in the KVM's terminal, not on the connected computer. A process with "crond -i /tmp/.log" means GL.iNet treats the device as infected.
    link: { label: GL.iNet's notice, url: https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056 }
  - title: If it is infected, reset it or install the security firmware
    text: >-
      GL.iNet says you can restore the device to factory settings to address the infection, and still recommends the latest stable security firmware.
    link: { label: Reset guide, url: https://docs.gl-inet.com/kvm/en/faq/factory_reset/ }
  - title: If it is infected, check the computer connected to it
    text: >-
      Look for programs, browser extensions or accounts you don't know, unexpected startup items or scheduled tasks, changed settings and unusual network activity. Run a full scan with up-to-date security software.
  - title: Install the stable security firmware
    text: >-
      Scheduled for 22 November 2026. Beta builds with the security fixes are available now, 1.10.2 for RM1, RM1V2, RM1PE, RM4PE, RM10 and RM10RC, 1.8.6 for RMQ1.
    link: { label: Firmware downloads, url: https://dl.gl-inet.com/ }
- audience: Routers
  steps:
  - title: Check the router
    text: >-
      Over SSH run "ps | grep tmp", or search the process list in LuCI for "tmp/.log". A process with "crond -i /tmp/.log" means GL.iNet treats the router as infected.
    link: { label: GL.iNet's notice, url: https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056 }
  - title: If it is infected, reset it or install the security firmware
    text: >-
      GL.iNet says you can restore the router to factory settings to address the infection, and still recommends the latest stable security firmware. A reset erases your settings and installed apps.
    link: { label: Reset guide, url: "https://docs.gl-inet.com/router/en/4/faq/repair_network_or_reset_firmware/#reset-to-factory" }
  - title: If the check finds nothing
    text: >-
      GL.iNet says no factory reset or other cleanup is needed. GL.iNet staff and the community have found cases this check misses, so run the other checks too.
  - title: Install the stable security firmware
    text: Scheduled for 22 November 2026. GL.iNet recommends it for every device.
    link: { label: Firmware downloads, url: https://dl.gl-inet.com/ }

check:
- title: GL.iNet's check
  text: >-
    "crond -i /tmp/.log" in the output means the device is infected according to GL.iNet. "cat /tmp/f" is the remote shell the community found, also a hit. The line with "grep tmp" is the check itself. A clean result is not enough, so run the other checks too. On a KVM the command is "ps -aux | grep tmp", on the RMQ1 "ps -a | grep tmp".
  command: ps | grep tmp
- title: The same in the admin panel
  menu: [ System, Advanced Settings, LuCI, Status, Processes ]
  text: >-
    Search the page (Ctrl+F, on a Mac Cmd+F) for "tmp/.log" and look for "crond -i /tmp/.log".
- title: Processes that remote shells use
  text: >-
    No output is the good result. nc, netcat, socat, "/bin/sh -i" or mkfifo in the output need a closer look.
  command: ps ww | grep -E '[n]c |[n]etcat|[s]ocat|[/]bin/sh -i|[m]kfifo'
- title: The shell's pipe
  text: >-
    The remote shell's pipe /tmp/f stays after the shell was stopped and only goes away at a restart. If the line starts with "p", the shell has run since the last restart. "No such file" is the good result.
  command: ls -la /tmp/f
- title: Is netstat still the original?
  text: >-
    GL.iNet staff warns that netstat can be replaced on an infected device and that running the replacement starts the malware. On a router the line must end in "-> busybox". If it does not, don't run netstat.
  command: ls -l /bin/netstat
- title: Connections to the reported address
  text: >-
    Only after the check above. The remote shells connect to 170.39.226.219. Any output means such a connection is open; the last column shows the process and its PID. Without the filter, "netstat -tnp" lists all connections: look for ones held by nc, netcat, sh or ash.
  command: netstat -tnp | grep '170.39.226.219'

details: |
  On 20 November 2026 GL.iNet identified a vulnerability in its cloud remote management services. According to GL.iNet, an unauthorized party used it to access a subset of GL.iNet routers and KVM devices and to install malicious software on them.

  GL.iNet says it fixed the cloud vulnerability and blocked the access used, so devices can no longer be newly infected through this path. That does not remove malware from devices that were already infected. GL.iNet is still determining the scope, including whether computers connected to affected KVM devices were impacted.

  Its notice, last updated on 21 November, names one sign of an infection: a running process "crond -i /tmp/.log". What GL.iNet says to do in either case is under "Do this now". Stable security firmware for routers and KVM devices is scheduled for 22 November 2026; for KVM devices, beta builds with the fixes are available. The notice names no router firmware version yet. GL.iNet will email affected customers at the address of their GoodCloud account.

  In its forum, GL.iNet staff added that a clean result of that check is not enough. Users had reported remote shells that connect to 170.39.226.219, so staff recommends checking open connections and running processes as well, and warns that netstat itself can be replaced on an infected device. If you find such a shell, staff says: save the output of "ps ww" and "netstat -tnp", stop the process with "kill -TERM" and its PID (then "kill -KILL"), treat the router as compromised, disconnect it from the internet and keep the evidence. Staff also points to the community script as the best available check for known traces at the moment.

  What follows was found by the community, not by GL.iNet.

  The remote shell. Forum users and RemoteToHome Consulting found the same remote root shell on GL-AXT1800 routers with firmware 4.8.3, connected to 170.39.226.219 on a different port each time. Where the start was measured, it was about 21:40 UTC on 20 November. GL.iNet's indicator process was not running on those routers. The shell leaves no file behind and its pipe /tmp/f is gone after a restart, so a router that was restarted or updated since can pass every check of running processes even if it was hit. The anonymous reports have since shown the same traces on many more models, see the table above.

  The cause. RemoteToHome read the GoodCloud client taken from such a router (package gl-sdk4-cloud). According to its findings, a handler for an AstroWarp / SD-WAN command puts an address from the cloud message into an iptables command without checking it, so a crafted address runs as a command, whether or not AstroWarp is switched on. It found the same code in the 4.8.4 beta for the GL-AXT1800 and in firmware 4.11.0 for the GL-MT3000. GL.iNet has not confirmed this.

  The attacker's server. The address the shells connect to was a rented server. After RemoteToHome's abuse report the hosting provider confirmed on 21 November that it has suspended the server and preserved it for an investigation.

  A factory reset may not be enough. RemoteToHome tested several routers and found that root can write to the stored firmware image (/rom) on most models, and in further tests to the boot area as well. A factory reset restores from that image, so it would keep a change made there. Nobody has reported such a change on a hit device so far. RemoteToHome's advice is a full reflash without keeping settings, and it has asked GL.iNet to publish hashes of its firmware so that devices can be verified.

  KVM firmware. Admon and RemoteToHome compared GL.iNet's firmware images. The 1.10.2 build for the RM1PE deletes the malware's files at boot and keeps no copy, so updating an infected RM1PE removes the evidence that it was infected. The 1.10.2 builds for the RM1 and RM1V2 contain no such cleanup. On an RM1, an update that keeps settings carries over the password file, the SSH keys and everything under /etc/kvmd/user.

  Earlier than 20 November. One forum user recorded the network traffic of a GL-RM1 that was taken over on 19 November at 02:35 UTC, a day before the date in GL.iNet's notice: it connected to 65.20.71.131, fetched files from 66.245.219.252 and looked up gl-inet.top. That is a name GL.iNet used in the past. The registry shows it as registered anew on 16 November 2026, so whether GL.iNet still holds it is not known. Separately, forum users found an older backdoor on routers, see our note below.

unknowns:
- Which models and firmware versions were affected, and how many devices. GL.iNet has not published this; the table above shows only where traces were reported.
- When it started. GL.iNet names 20 November; one user recorded a takeover of a KVM on 19 November.
- Whether the cause RemoteToHome found in the GoodCloud client is right, and which firmware removes it. GL.iNet has not commented.
- What the malicious software does, and how the process GL.iNet names relates to the "gl-helper" files found on KVM devices.
- What was run through the remote shells, and which other addresses are involved.
- Who holds gl-inet.top now. GL.iNet used the name in the past; the registry shows a new registration on 16 November 2026.
- How to tell whether a device was compromised earlier. No check can show that after a restart.
- Whether a factory reset is enough. GL.iNet says it is; RemoteToHome found that the image a reset restores from can be changed by root.
- Whether the older backdoor has to do with this incident, and how it got onto devices.
- Whether data such as cloud account details or passwords was exposed. The notice doesn't say.
- Whether computers connected to affected KVM devices were affected. GL.iNet is still investigating.

