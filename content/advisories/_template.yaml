# Template for a security advisory. Files starting with "_" are ignored.
#
# Copy this file to <id in lower case>.yaml, e.g. csa-2026-02.yaml, and
# fill it in. Each file becomes a page at /security/<id>/, an entry in the
# archive and in the RSS feed (/security/feed.xml). While "status" is
# active (investigating, fix-rolling-out, mitigated), the site also shows
# the bar on every page, the "Security" pill in the navigation and a note
# in every install sheet.
#
# Write plain English, like the rest of the site. Say what GL.iNet said,
# say what we don't know, and don't guess. Dates are UTC unless you give a
# zone: 2026-11-20, or 2026-11-20T18:05+01:00. The build checks every field.

# Our own ID, always set, even when there is a CVE. Next free number per year.
id: CSA-2026-02

# One line, no full stop. Shown as the page heading and in the archive.
title: What happened, in a few words

# Our rating: critical (from the internet, no login needed),
# high (from the local network, or with a login), medium (limited impact or
# an unusual setup), low (hardening, no known attack).
severity: high
# Optional: GL.iNet's own rating, as they wrote it.
# vendor_severity: high

# true once attacks have been seen ("exploited in the wild").
exploited: false

# investigating | fix-rolling-out | mitigated (workaround, no fix yet)
# | fixed | no-fix (e.g. end of life). The first three count as active.
status: investigating

published: 2026-11-20
# Bump this with every change: the RSS feed shows the advisory again, and
# readers who dismissed the "Resolved" bar see it again.
updated: 2026-11-20T18:05Z

# Optional, active advisories only: end the bar (and the "Security" pill and
# install sheet notes) at this date (end of day, UTC) or moment. The advisory
# stays active on its page and in the archive. Without it, the bar stays as
# long as the advisory is active. Once "fixed", the green "Resolved" bar shows
# for 48 hours after "updated" by itself; give "updated" a time for that.
# banner_until: 2026-12-15

# [] when there is none (most issues), "requested", or [CVE-2026-1234].
cve: []

# How sure we are:
#   gl-inet-public  GL.iNet said so publicly (needs a gl-inet, gl-inet-forum
#                   or gl-inet-release-notes source)
#   gl-inet-staff   GL.iNet staff confirmed it to us directly (needs a
#                   gl-inet-staff source). Share only what GL.iNet agreed to.
#   unconfirmed     user or researcher reports we checked ourselves
confirmed: gl-inet-public

# Required while active, max. 170 characters: the text of the bar. Once
# "fixed", the text of the green "Resolved" bar: say what was fixed and
# whether anyone still has to do something.
banner: >-
  One or two sentences: what happened and the single most important thing
  to do.

# Two to four sentences at the top of the page and in the feed.
summary: >-
  What is affected, what an attacker can do, what GL.iNet has done and what
  users should do.

affected:
  summary: >-
    Who is affected, in a sentence or two. Say so when GL.iNet hasn't
    published a list.
  products: [Routers]            # chips when there is no model table
  firmware: 4.0.0 to 4.8.1       # optional, short
  fixed_in: 4.8.2                # optional; otherwise taken from models
  not_affected: Firmware 3.x     # optional

# Optional: one line per model, drives the table on the page.
models: []
#  - { name: Flint 2, sku: GL-MT6000, affected: 4.0.0 – 4.8.1, fixed: 4.8.2, released: 2026-11-21 }
#  - { name: Flint 3, sku: GL-BE9300, affected: 4.6.0 – 4.8.1, fixed: 4.8.2, expected: this week }
#  - { name: Slate, sku: GL-AR750S, affected: 4.0.0 – 4.3.x, eol: true }

# What to do, in GL.iNet's order. One group per audience, or a single group
# without "audience". Links must point to gl-inet.com (docs, downloads).
actions:
  - audience: Routers
    steps:
      - title: Update the firmware
        text: In the admin panel under System → Upgrade.
        link: { label: Firmware downloads, url: https://dl.gl-inet.com/ }

# Optional: how to check a device.
check: []
#  - title: Firmware version
#    menu: [System, Overview, Firmware version]
#    command: cat /etc/glversion

# Optional: "What we know". Paragraphs separated by a blank line.
details: |
  First paragraph.

  Second paragraph.

# Optional: open questions. Remove them as they get answered.
unknowns:
  - Which models are affected.

# Newest first or in any order; the page sorts them. "tag" is optional.
timeline:
  - { at: 2026-11-20T18:05Z, text: GL.iNet confirms the issue. }

# Every source, labelled by type:
#   gl-inet, gl-inet-forum, gl-inet-release-notes   (must link to gl-inet.com)
#   gl-inet-staff   direct confirmation to us: no url, "note" required
#   cve             (nvd.nist.gov or cve.org)
#   researcher, community
sources:
  - type: gl-inet-forum
    label: Title of the forum post
    url: https://forum.gl-inet.com/
    date: 2026-11-20

# Optional: GL.iNet addresses to contact (only @gl-inet.com).
contacts: []
#  - { label: Is my device affected?, email: support@gl-inet.com }

# Optional: community apps this advisory concerns (ids as in the page
# anchors, e.g. glinet-tailscale-updater). Their cards get an "Advisory" pill.
apps: []
# Optional: a sentence about community apps, shown on the page.
# apps_note: None of the community apps cause this.

# Optional: a fix or check tool built by the community. Shown as its own
# dark green card right after "Do this now" and as "Community fix" in the bar.
# Say what GL.iNet has not provided yet, and in "caveat" what the tool is not.
# community_fix:
#   title: No official tool to check a device yet, so the community built one
#   text: |
#     What it does and who wrote it.
#   caveat: Community work, not a GL.iNet tool. Not reviewed by GL.iNet.
#   # Optional: one line at the top of "Do this now", before GL.iNet's steps,
#   # when the tool should run first (max. 160 characters).
#   before: A reset wipes the traces. Run the community script first.
#   # Optional: with a command, the tool becomes the first block in "Do this
#   # now" and GL.iNet's steps follow as "Or check by hand". "does" lists
#   # what it does (max. 5 short points).
#   command: wget -q https://example.org/tool -O tool.sh ; sh tool.sh
#   # Optional: the same command with other tools; the reader switches in the block.
#   command_variants:
#     - { name: curl, command: curl -fsSL https://example.org/tool -o tool.sh ; sh tool.sh }
#     - { name: wget, command: wget -q https://example.org/tool -O tool.sh ; sh tool.sh }
#   does: [Runs GL.iNet's check, Saves evidence first]
#   author: Who wrote it, in a sentence or two (max. 260 characters).
#   link: { label: Check your device, url: /security/csa-2026-02/fix/ }
#   image: /img/csa-2026-02-fix.svg   # optional, a file in public/

# Optional: our own view as the community team, in a separate box right
# after "Do this now", e.g. where GL.iNet's advice needs care in some setups.
# Titles: max. 90 characters.
# Keep it clearly ours: no claims on GL.iNet's behalf.
# community:
#   date: 2026-11-21
#   notes:
#     - title: In a business network, talk to your cyber insurer before you reset
#       # Optional: one line at the top of "Do this now", before the steps,
#       # when people should read this note before they act (max. 160 characters).
#       before: A reset destroys logs that your insurer may need.
#       text: |
#         First paragraph.
#
#         Second paragraph.
#       # Optional: a link to community work, e.g. a script: a page of this
#       # site (/security/csa-2026-02/fix/) or an https:// address. Say in the
#       # text that it is community work and not reviewed by GL.iNet.
#       link: { label: Script on GitHub, url: https://github.com/ }
