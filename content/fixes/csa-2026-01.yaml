ai_note: "This page was written by an AI model. It rests on what the community sees and has been working on since the incident began: the anonymous reports, the forum and the firmware."
report_problem:
  label: Report a problem
  text: Bugs and false alarms. Never attach an evidence archive.
  url: https://github.com/admonstrator/glinet-csa-2026-01/issues
hero_note: Over SSH, as root. The script only reads. Its first lines show its version and how old it is.
run_note: You can read the script before you run it. On an infected device `netstat` is replaced by a script that hides the malware’s connections. The script never calls it.
