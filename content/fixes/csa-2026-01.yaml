# The guide of the community script for CSA-2026-01, shown at /security/csa-2026-01/fix/.
# In these texts a path, a command, an option or an address stands between backticks; the
# page sets it in a monospace face. The list of versions is kept in the page itself
# (src/pages/security/csa-2026-01/fix.astro).
intro: GL.iNet’s quick check looks at running processes. This script runs that check and also looks at the files on the device. It can save the evidence and remove the known traces.
steps:
  - title: Check
    text: Read-only. It prints a report.
    command: curl -fsSL https://app.gl-i.net/csa-2026-01-fix -o gl-helper-triage.sh ; sh gl-helper-triage.sh
  - title: Save the evidence
    text: Writes an archive to `/tmp`, which is in memory, so copy it to your computer before you restart. It contains your configuration, possibly including Wi-Fi and VPN keys. Do not post it.
    command: sh gl-helper-triage.sh --archive
  - title: Clean up
    text: Only if the check found something. Saves the evidence again, stops the malware, removes its files and autostart entries, and checks again.
    command: sh gl-helper-triage.sh --fix
notes:
  - title: Community work, not a GL.iNet tool
    text: GL.iNet’s notice calls this script the first choice for a broader check, describes it as an independent third-party project, and says to use it for checking only. GL.iNet did not write it. Use it at your own risk.
  - title: Run it before you restart, reset or update
    text: A restart removes the remote shell. The security firmware deletes known traces the first time it boots.
  - title: It does not replace the security firmware
    text: The script finds and removes only the traces we know of. Install GL.iNet’s security firmware either way.
  - title: Nothing found? New passwords and keys anyway
    text: If the device was connected to GoodCloud, give it a new admin password and new VPN and SSH keys, even if the script finds nothing. GL.iNet advises this for every such device. An update cannot take back what was already copied.
  - title: On a business network, wait
    text: Talk to your cyber insurer or incident response provider before you change the device.
result:
  address: csa.gl-i.net/#AA006011D-2PJ2W
  text:
    - The script ends with an address like this one. Open it in a browser or type it in. Upper and lower case do not matter.
    - The page says what was found, what it means and what to do, in English, German and Chinese. It also tells you whether newer firmware is available for your model.
    - The code stands for the result, the model and its firmware version. It cannot tell your device apart from others of the same kind, and opening the address sends nothing from the device. You can post it in the forum as is.
  verdicts:
    - verdict: INFECTED
      tone: bad
      text: The malware’s files, a remote shell, GL.iNet’s indicator process or the older backdoor are on the device.
      then: Save the evidence. Then follow “After the check”.
    - verdict: ATTACKED
      tone: warn
      text: A command sent through GoodCloud ran as root. No malware files or remote shell are present now.
      then: There is no way to tell afterward what ran. Treat the device as if it had been hit.
    - verdict: no gl-helper indicators found
      tone: ok
      text: None of the known traces.
      then: Not proof that nothing happened. If the device has restarted or been updated since the attacks began, the result says little about the time before that. Was it connected to GoodCloud? Then install the security firmware and give it a new admin password and new VPN and SSH keys anyway.
  labels:
    - label: IOC
      meaning: A known trace of the malware.
      fix: Removes it, except a file known only from the community list.
    - label: PERSIST
      meaning: A changed `rc.local` or root crontab that does not name the malware.
      fix: Resets it only when an IOC was found.
    - label: REVIEW
      meaning: An unusual change. Not proof of an infection. Check whether it is yours.
      fix: Never touches it.
    - label: INFO
      meaning: Context, for example a file a package installed.
      fix: Never touches it.
  exit_codes: "Exit codes: 0 clean, 1 traces found, 2 fixed and clean, 3 fix incomplete, 4 error."
  labels_title: The labels in the output, and what `--fix` does with each
update:
  lead: The script changes several times a day. Every run shows in its first lines how old your version is.
  command: sh gl-helper-triage.sh --update
  note: "It installs a new version only if its signature checks out, and never an older one. Versions before 2.50 do not have this option: download the script again. On firmware that lacks the tool to check the signature, the script says so and asks first."
looks_for:
  - title: The `gl-helper` malware
    items:
      - Its files `gl-helper` and `gb` in `/etc/glinet/.cache` and `/etc/config/.gl`, and in the directories the installer falls back to.
      - Its scripts, such as `watch.sh` and `run.sh`.
      - Its lines in `rc.local` and in the crontabs, including the firmware’s own cron directory.
      - An SSH key named `gl-agent`.
      - The remote terminal service set to the attacker’s server.
      - Its two servers, `65.20.71.131` and `66.245.219.252`.
  - title: The remote shell
    items:
      - A process that uses `/tmp/f` and connects to `170.39.226.219`.
      - The pipe `/tmp/f`, which stays until the next restart.
      - GL.iNet’s indicator process `crond -i /tmp/.log`.
      - "Tools that shells use: `nc`, `socat`, `/bin/sh -i`."
  - title: The command from the cloud
    items:
      - The empty file `/etc/mp_ip_mapping_info`. It is still there after a restart.
      - The firewall rule the command left behind.
  - title: Running programs
    items:
      - Every running program is compared with the firmware image.
      - Any program that was started from `/tmp`, is not part of the firmware, or differs from it is listed for review.
      - This only shows what is running right now.
  - title: Network and firewall
    items:
      - Open connections, each with its program.
      - Every line of the firewall configuration that is not in the firmware image. Your own port forwards appear there too.
      - Active rules that redirect traffic.
  - title: Replaced tools and autostart
    items:
      - System tools that were replaced, such as `netstat`.
      - "Autostart entries that point to the malware: crontabs, `rc.local`, init scripts, and the lists of files an update keeps."
  - title: The older backdoor
    items:
      - "`/etc/init.d/urandom_seed` with extra lines."
      - "`/bin/ulogd`, and `/usr/bin/monitord` as a copy of the Lua interpreter."
      - A running `monitord` or `ujaild`.
      - Its files on the list an update keeps.
      - Compiled Lua in the writable part of the system.
      - Its server names in the configuration. None of them belongs to AdGuard or OpenWrt.
      - The script reports this backdoor and does not remove it. Reflash with “keep settings” off, and do not restore a backup from that device.
  - title: Its own tools
    items:
      - The script takes its tools from the firmware image, not from the running system.
      - It checks that those tools load the firmware’s own libraries. The line `Trusted tools` at the top shows the result.
lookup:
  lead: "From 2.60 the script can look up the files it lists for review in a list the community keeps: the malware’s known files, and files the community team has checked, such as its own Tailscale and AdGuard Home builds. It compares fingerprints (SHA-256), not what a file does, so only an exact copy of a file on the list is known. The answer can make the result worse, never better."
  answers:
    - answer: "community list: known malware"
      tone: bad
      text: The verdict becomes `INFECTED`, with exit code 1. `--fix` leaves the file in place, so reinstall the firmware without keeping settings.
    - answer: "community list: probably safe, not a proof"
      text: Nothing. The file stays listed for review. The community team marked this exact file as probably safe, or it comes from one of the community’s builds.
    - answer: "community list: not known"
      text: Nothing. Most files are not on the list.
  sent:
    - "For each file listed for review, up to 40 and programs first: the SHA-256 of its kind and path, and the SHA-256 of the file."
    - The script version and a random number for this run.
  never:
    - A path or a file name in plain text, or anything from inside a file.
    - Accounts listed for review.
    - Device ID, model, firmware or host name.
    - The server stores none of it. For files on its own list, it only counts on how many days they were asked about.
  controls:
    - key: --lookup
      text: checks without asking and still shows what it sends
    - key: --no-lookup
      text: never asks
  note: "It asks only during a check (`--check`, the default, or `--archive`), not with `--fix`, and only when something is listed for review. Without a terminal it sends nothing unless you add `--lookup`. It sends only with a tool that checks the server’s certificate (`curl`, `uclient-fetch` or GNU `wget`) and gives up after 25 seconds. Ctrl-C stops the check, not the run. With `--archive`, the request and the answer go into the archive as `lookup.txt`."
report:
  lead: "At the end, the script offers to send a short report, even if it found nothing: reports from clean devices show which models and versions were not hit. Nothing leaves the device until you answer y."
  sent:
    - Model, firmware version, script version, time of the check, time since the last boot.
    - Which known traces were found, and where.
    - "For the malware’s files: fingerprint, size and time."
    - "What it listed for review, up to 40 findings: kind and path, and for a file its fingerprint and times. An account the firmware does not have is sent with its name."
    - Changed lines of autostart files and the firewall rules the attack used. Lines you added yourself are part of this, and the script shows them before it asks.
    - Whether GoodCloud and AstroWarp are on, and whether the device is bound to an account.
    - A device ID, so that two reports from one device count only once. It is a hash, and the server hashes it again.
  never:
    - Host name, IP address or MAC address.
    - The name of your GoodCloud account.
    - Passwords, keys, or hashes of them.
    - Any other file.
    - The address the report came from is not stored.
  controls:
    - key: v
      text: shows everything that would be sent
    - key: --no-report
      text: never asks
    - key: --no-device-id
      text: leaves the device ID out
afterwards:
  - audience: Router
    items:
      - Install the newest stable firmware for your model. GL.iNet’s notice lists the minimum version for each model.
      - If the device was hit, or you suspect it was, install it without keeping settings, from a file you downloaded yourself, set it up again and do not restore a backup. GL.iNet now gives the same advice. The update deletes the known files. It leaves the older backdoor’s programs and anything else that was changed.
      - Choose a reflash like this over a factory reset. A reset keeps the installed firmware image, and on at least one model, root can write to it.
      - Export the device log from your GoodCloud account. It may show the attacker’s command.
      - Change the device password, the cloud password and your SSH keys. GL.iNet advises a new admin password and new VPN and SSH keys for every device that was connected to GoodCloud, even if nothing was found.
      - Delete the router’s VPN profile at the other end and create a new one.
      - Check the devices behind the router.
      - If you switched SSH on for the check, switch it off again under Security > Admin Access (on firmware before 4.9, System > Security). A reinstall without settings turns it back on, because GL.iNet’s firmware has SSH on by default.
  - audience: KVM (Comet)
    items:
      - "Install the security firmware: 1.10.3 or later, 1.8.7 or later for the RMQ1."
      - If the KVM was hit, or you suspect it was, clear “Save current configuration” when you install it, set it up again and do not restore a backup. GL.iNet now gives the same advice. An update that keeps settings also keeps the password, the SSH keys and everything under `/etc/kvmd/user`, including any boot scripts there.
      - If it was connected to GoodCloud, change its admin password and any VPN and SSH keys, even if nothing was found.
      - Look for keys and scripts you did not add.
      - Check the computer attached to the KVM.
more:
  - title: Advisory CSA-2026-01
    text: What happened, who is affected, what is known.
    url: /security/csa-2026-01/
  - title: RemoteToHome’s findings
    text: How the remote shell got in, what the KVM firmware does, how to recover a device.
    url: https://github.com/RemoteToHome-io/gl-security-incident-2026
  - title: Source code and README on GitHub
    text: All options, the script for running it from your computer, the tests.
    url: https://github.com/admonstrator/glinet-csa-2026-01
ai_note: "This page was written by an AI model. It is based on what the community has seen and worked on since the incident began: the anonymous reports, the forum and the firmware."
report_problem:
  label: Report a problem
  text: Bugs and false alarms. Never attach an evidence archive.
  url: https://github.com/admonstrator/glinet-csa-2026-01/issues
hero_note: On a router, over SSH as `root`. On a KVM, in its web interface under Toolbox > Terminal. The script only reads. Its first lines show its version and how old it is.
hero_link:
  label: GL.iNet’s guide to logging in over SSH
  url: https://docs.gl-inet.com/router/en/4/tutorials/ssh_log_in_to_the_router/
run_note: You can read the script before you run it. On an infected device, `netstat` is replaced by a script that hides the malware’s connections. The script never runs it.
