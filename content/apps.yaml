# Curated content for every public repository in GLiNet-Community-Scripts.
#
# Static, hand-maintained fields only. Stars, latest release and last update
# are fetched by the nightly GitHub Action and never edited here.
#
#   repo:         exact repository name in the organization
#   upstream:     owner/repo of the original project (credit + "Original repository" link)
#   kind:         tool (community app) | official (GL.iNet code) | docs (GL.iNet docs)
#   category:     vpn | network | cellular | system | apps | kvm | firmware | docs
#   type:         router-script | luci-app | router-service | desktop-app | docker | bot | firmware | docs | module-tools
#   install:      verbatim one-liner from the project README, or null
#   install_note: short hint when there is no one-liner
#   readiness:    stable | beta | experimental
#   icon:         tile glyph name
#   notes:        caveats shown in the detail view
#
# Texts were drafted from each project's README (Oct 2026); keep them factual.

- repo: glinet-tailscale-updater
  upstream: admonstrator/glinet-tailscale-updater
  author: admonstrator
  name: Tailscale Updater
  kind: tool
  category: vpn
  type: router-script
  tagline: Latest Tailscale on GL.iNet, using compact binaries
  description: >-
    Shell script that downloads and installs the latest Tailscale release on GL.iNet routers with firmware
    4.x and on Comet / Comet Pro KVMs, using size-reduced "tiny" binaries by default. It can also install
    a specific version, enable Tailscale SSH, and restore the original firmware binaries.
  features:
    - Installs latest Tailscale using space-saving tiny binaries
    - Choose a specific release with --select-release
    - Optional Tailscale SSH setup via --ssh
    - Restore original firmware binaries with --restore
    - Sets --stateful-filtering=false for exit node use
  install: wget -q https://get.admon.me/tailscale -O update-tailscale.sh ; sh update-tailscale.sh
  install_note: null
  devices:
    - Flint 3 (GL-BE9300)
    - Comet (GL-RM1)
    - Comet Pro (GL-RM10)
  firmware: GL.iNet 4.x
  license: MIT
  tech:
    - POSIX sh
    - UPX
  links:
    - label: Forum thread
      url: https://forum.gl-inet.com/t/how-to-update-tailscale-on-arm64/37582
    - label: GL.iNet Toolbox
      url: https://github.com/Admonstrator/glinet-toolbox
    - label: Tailscale SSH docs
      url: https://tailscale.com/kb/1193/tailscale-ssh
  readiness: stable
  icon: tailscale
  notes: >-
    Enable Tailscale in the GL.iNet router settings before running. Needs at least 15 MB free space and
    should not be run as a cron job. Supported architectures: arm64, armv7, mips, mipsle, x86_64. README
    says it is tested on nearly all GL.iNet routers with firmware 4.x; KVM support (firmware V1.9.1 and
    1.10) is based on community reports, and --restore is not available on KVMs.

- repo: gl-tailscale-fix
  upstream: RemoteToHome-io/gl-tailscale-fix
  author: RemoteToHome-io
  name: Tailscale Fix
  kind: tool
  category: vpn
  type: router-service
  tagline: Kill switch and exit-node controls for Tailscale
  description: >-
    An .ipk plugin that adds controls to the Tailscale page of the GL.iNet admin panel: a kernel-level
    kill switch for IPv4 and IPv6, exit node advertising, guest network routing through the exit node,
    a Tailscale SSH toggle and a Tailscale version manager. No GL.iNet scripts or binaries are modified,
    and on firmware 4.9+ it hides the features GL.iNet now provides natively.
  features:
    - Routing-level kill switch for IPv4 and IPv6
    - One-click toggle to advertise as exit node
    - Guest network routing through the exit node
    - Tailscale version manager using compact binaries
    - Survives firmware upgrades; clean removal via opkg
  install: wget -q https://github.com/RemoteToHome-io/gl-tailscale-fix/releases/latest/download/install-gl-tailscale-fix.sh
    -O install-gl-tailscale-fix.sh && sh install-gl-tailscale-fix.sh
  install_note: null
  devices:
    - Slate AX (GL-AXT1800)
    - Beryl AX (GL-MT3000)
    - Flint (GL-AX1800)
    - Brume 2 (GL-MT2500)
    - Flint 2 (GL-MT6000)
    - Slate 7 (GL-BE3600)
    - Flint 3e (GL-BE6500)
    - Brume 3 (GL-MT5000)
    - Beryl 7 (GL-MT3600BE)
    - Puli AX (GL-XE3000)
    - Slate Plus (GL-A1300)
    - Mudi 7 (GL-E5800)
  firmware: GL.iNet 4.x (tested 4.5.22 to 4.9.0)
  license: GPL-3.0
  tech:
    - Lua
    - POSIX sh
    - JavaScript
    - nginx/OpenResty
    - UCI
  links:
    - label: Setup guide
      url: https://remotetohome.io/gl-tailscale-fix
    - label: Blog post
      url: https://remotetohome.io/blog/gl-tailscale-fix/
    - label: Forum thread
      url: https://forum.gl-inet.com/t/enhanced-tailscale-for-gl-inet-routers-proper-ts-killswitch-one-click-exit-node/67565
  readiness: beta
  icon: shield
  notes: >-
    The README says the plugin should be considered beta because GL.iNet's Tailscale integration can change
    with firmware updates; check for a new plugin release before upgrading firmware. Do not run `tailscale
    update` or the Tailscale web dashboard update: the ~52 MB upstream binaries can fill the flash overlay
    and potentially brick the router (use the plugin's Version Manager instead). The kill switch covers
    LAN/guest to WAN traffic; do not run another VPN client on the same network segment. Testing depth
    varies by model (some only install/remove verified; version manager unsupported on Slate Plus).

- repo: wg-udp-relay
  upstream: RemoteToHome-io/wg-udp-relay
  author: RemoteToHome-io
  name: WireGuard UDP Relay
  kind: tool
  category: vpn
  type: docker
  tagline: Bounce VPN traffic through a VPS relay
  description: >-
    A Go UDP relay you run on a VPS with Docker Compose to forward WireGuard (or other UDP VPN) traffic
    to a self-hosted server, such as a GL.iNet router at home on a DDNS address. It re-resolves the DDNS
    hostname and migrates sessions when the home IP changes, and never decrypts the tunnel.
  features:
    - Listens on multiple ports, e.g. 51820 and 443
    - Re-resolves DDNS and migrates sessions on IP change
    - Works with WireGuard, AmneziaWG, OpenVPN UDP, Hysteria2
    - Forwards encrypted packets without needing VPN keys
    - Docker Compose deployment with .env configuration
  install: null
  install_note: >-
    Runs on a VPS, not on the router: clone the repo, copy .env.example to .env, set LISTEN_PORTS, ENDPOINT_DDNS
    and ENDPOINT_PORT, then run `docker compose up -d`. Can also be built from source with Go 1.20+.
  devices: []
  firmware: null
  license: GPL-3.0
  tech:
    - Go
    - Docker Compose
  links: []
  readiness: stable
  icon: route
  notes: >-
    Requires a VPS. UDP buffer tuning on the relay VPS is needed for high throughput (README: 30-60 Mbps
    untuned vs 200-300+ Mbps tuned). The relay is not transparent: the VPN server sees all clients as
    the relay's IP. For glddns.com hostnames, keep the DNS check interval at 5 minutes or more.

- repo: glinet-tailscale-exitnode-switch
  upstream: nsouto/glinet-tailscale-exitnode-switch
  author: nsouto
  name: Tailscale Exit Node Switch
  kind: tool
  category: vpn
  type: router-script
  tagline: Side switch toggles the Tailscale exit node
  description: >-
    Patches GL.iNet's gl_tailscale wrapper and adds a background monitor so the router's physical side
    switch turns use of the exit node selected in the GL.iNet UI on or off. Tailscale itself stays enabled;
    the switch only controls whether traffic goes through the exit node.
  features:
    - Physical side switch enables or disables exit node
    - Backs up gl_tailscale before patching
    - Install, status and uninstall commands
    - Switch does nothing if no exit node selected
    - Background monitor restarts Tailscale on switch change
  install: curl -fsSL https://raw.githubusercontent.com/nsouto/glinet-tailscale-exitnode-switch/main/glinet-tailscale-exitnode-switch.sh
    | sh -s -- install
  install_note: null
  devices:
    - Beryl AX (GL-MT3000)
    - Slate 7 (GL-BE3600)
  firmware: GL.iNet 4.x (tested 4.8.1 and 4.8.x)
  license: MIT
  tech:
    - POSIX sh
    - UCI
  links:
    - label: Forum thread
      url: https://forum.gl-inet.com/t/side-toggle-switch-for-tailscale-exit-node/64947/10
  readiness: stable
  icon: toggle
  notes: >-
    Modifies the system file /usr/bin/gl_tailscale (backups are created) and adds a startup entry to /etc/rc.local;
    the uninstall command restores the original. Other 4.x models are "likely" to work if they have the
    expected GL.iNet files; otherwise the installer fails safely. Unofficial; developed with AI assistance.

- repo: GL.iNet-Tailscale-Enable-SSL
  upstream: techrelay/GL.iNet-Tailscale-Enable-SSL
  author: techrelay
  name: Tailscale SSL Enabler
  kind: tool
  category: vpn
  type: router-script
  tagline: Trusted Tailscale HTTPS certificate for the admin UI
  description: >-
    Two shell scripts that request a Tailscale-issued HTTPS certificate for the device's tailnet name
    (*.ts.net) and install it into a GL.iNet router's nginx or a GL-KVM's kvmd, replacing the self-signed
    certificate. They back up the existing certificates and check that the new one is served.
  features:
    - Detects the device's tailnet domain automatically
    - Generates the certificate with tailscale cert
    - Backs up existing HTTPS certificates first
    - Separate scripts for routers (nginx) and KVMs (kvmd)
    - Verifies the new certificate is being served
  install: wget -q https://raw.githubusercontent.com/techrelay/GL.iNet-Tailscale-Enable-SSL/main/tailscale-ssl-router.sh
    -O tailscale-ssl-router.sh ; sh tailscale-ssl-router.sh
  install_note: null
  devices:
    - Flint 3 (GL-BE9300)
    - Slate 7 (GL-BE3600)
    - Spitz AX (GL-X3000)
    - Puli AX (GL-XE3000)
    - Slate 7 Pro (GL-BE10000)
    - Comet (GL-RM1)
    - Comet Pro (GL-RM10)
  firmware: null
  license: null
  tech:
    - POSIX sh
    - tailscale cert
    - nginx
    - kvmd
  links:
    - label: Tailscale Updater (recommended first)
      url: https://github.com/admonstrator/glinet-tailscale-updater
  readiness: stable
  icon: lock
  notes: >-
    Manual process: re-run about every 90 days to renew the certificate (or set up your own cron job).
    The certificate is valid only for the tailnet hostname, not the LAN IP. Requires HTTPS and MagicDNS
    enabled in the tailnet admin settings and an up-to-date Tailscale version. The install command above
    is the router script; on Comet / Comet Pro KVMs run tailscale-ssl-kvm.sh instead (command in README).
    No LICENSE file in the repo.

- repo: Tailscale-on-AP-mode
  upstream: GLiNet-Community-Scripts/Tailscale-on-AP-mode
  author: GLiNet-Community-Scripts
  name: Tailscale on AP Mode
  kind: tool
  category: vpn
  type: router-script
  tagline: Keep GL.iNet's Tailscale running in AP mode
  description: >-
    GL.iNet firmware stops its built-in Tailscale client whenever the device is not in router mode. This
    installs a small, reversible patch to /usr/bin/gl_tailscale so Access Point mode is treated as router
    mode for that check only, keeping the stock Tailscale package and binaries.
  features:
    - One-line patch treats AP mode as router mode
    - Stock Tailscale binaries stay untouched
    - Re-patches the new wrapper after firmware upgrades
    - status, apply and restore helper commands
    - Validates the patched script before replacing it
  install: wget -qO- https://raw.githubusercontent.com/GLiNet-Community-Scripts/Tailscale-on-AP-mode/main/install.sh
    | sh
  install_note: null
  devices: []
  firmware: GL.iNet 4.x
  license: MIT
  tech:
    - POSIX sh
    - OpenWrt init.d
    - UCI
  links:
    - label: Forum thread
      url: https://forum.gl-inet.com/t/tailscale-app-no-longer-running-in-ap-mode/35493
    - label: GL.iNet Tailscale docs
      url: https://docs.gl-inet.com/router/en/4/interface_guide/tailscale/
  readiness: stable
  icon: antenna
  notes: >-
    Unofficial workaround: GL.iNet does not support its Tailscale GUI integration in Access Point mode.
    Only AP mode is covered (Extender/Relay modes are left alone). It does not advertise the LAN as a
    subnet route; a never-authenticated router needs `tailscale up --accept-dns=false` once. Requires
    a model with GL.iNet's native Tailscale package. Version is the helper script's VERSION variable.

- repo: GL.iNet-TS-ZT-AW
  upstream: zippyy/GL.iNet-TS-ZT-AW
  author: zippyy
  name: Tailscale & ZeroTier Watchdog
  kind: tool
  category: vpn
  type: router-service
  tagline: Keeps Tailscale and ZeroTier up alongside AstroWarp
  description: >-
    A watchdog service for GL.iNet routers where enabling AstroWarp can disable or interrupt Tailscale
    or ZeroTier. Every 30 seconds it checks that tailscale0 and the zt* interface have an IPv4 address
    and, if not, re-enables the service in UCI and restarts it.
  features:
    - Checks Tailscale and ZeroTier IPv4 every 30 seconds
    - Restores GL.iNet UCI settings and restarts services
    - Leaves the AstroWarp tunnel (mptun0) alone
    - Logs recoveries to the system log
    - Starts at boot via an init service
  install: wget -qO- https://raw.githubusercontent.com/zippyy/GL.iNet-TS-ZT-AW/main/install.sh | sh
  install_note: null
  devices: []
  firmware: null
  license: null
  tech:
    - POSIX sh
    - procd
    - UCI
  links: []
  readiness: stable
  icon: radar
  notes: >-
    When recovering Tailscale it sets enabled, lan_enabled, wan_enabled and masq to 1 in tailscale.settings.
    Package/service names and UCI paths can vary by firmware; the README advises checking them before
    deploying on a substantially different device or firmware. No LICENSE file in the repo.

