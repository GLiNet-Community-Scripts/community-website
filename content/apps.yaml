  install: sh -c "$(curl -fsSL https://raw.githubusercontent.com/zippyy/GL.iNet-VLAN-Wizard/main/install.sh)"
  install_note: null
  devices: []
  firmware: null
  license: MIT
  tech:
    - POSIX sh
    - UCI
    - LuCI
    - rpcd
  links: []
  readiness: stable
  icon: vlan
  notes: >-
    LAN4 is always the tagged trunk port; other LAN ports are access ports. Assumes 192.168.<VLAN>.0/24
    subnets. The LuCI GUI installs from the feature/luci-plugin branch (command in README) and appears
    under Network -> VLAN Wizard. No specific router models are named as tested.

- repo: GL.iNET-Toggle-Switch
  upstream: zippyy/GL.iNET-Toggle-Switch
  author: zippyy
  name: WDS / Router Toggle
  kind: tool
  category: network
  type: router-script
  tagline: Flip the side switch between Router and WDS.
  description: >-
    Uses the physical side switch on GL.iNet routers to swap between two saved full-config backups, one
    for Router mode and one for WDS mode. Flipping the switch restores the matching backup with sysupgrade
    and reboots, and an interactive installer creates the profiles and can keep them across firmware upgrades.
  features:
    - Uses the hardware side toggle switch
    - Saves separate Router and WDS config profiles
    - Restores the matching profile and reboots on flip
    - Optional persistence across firmware upgrades
    - Interactive one-line installer
  install: sh -c "$(curl -fsSL https://raw.githubusercontent.com/zippyy/GL.iNET-Toggle-Switch/main/install.sh)"
  install_note: null
  devices: []
  firmware: GL.iNet 4.x
  license: null
  tech:
    - POSIX sh
    - sysupgrade
  links: []
  readiness: stable
  icon: toggle
  notes: >-
    Every flip restores a full config backup and reboots the router. Both profiles must come from the
    same router, and the WDS profile should be saved only after WDS is fully working. Needs firmware with
    toggle-switch scripting support (/etc/gl-switch.d/).

