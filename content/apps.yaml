    all radios. A LuCI web GUI version is available on a separate branch.
  features:
    - Per-VLAN subnet, DHCP and isolated firewall zone
    - Optional Wi-Fi SSID per VLAN on all radios
    - Optional client isolation
    - Validates VLAN IDs and port conflicts
