    - Slate 7 (GL-BE3600)
    - Beryl AX (GL-MT3000)
    - Beryl (GL-MT1300)
    - Spitz AX (GL-X3000)
    - Puli AX (GL-XE3000)
  firmware: null
  license: GPL-3.0
  tech:
    - POSIX sh
    - NGINX
    - OpenSpeedTest
  links:
    - label: OpenSpeedTest
      url: https://openspeedtest.com/
  readiness: stable
  icon: speed
  notes: >-
    The script requires about 64 MB of free space and offers external USB/SD storage if internal space
    is short (the README notes the GL-MT1300 was tested with an SD card). The script's self-update is
    marked beta.

- repo: Glinet-Bandwidth-script
  upstream: wickedyoda/Glinet-Bandwidth-script
  author: wickedyoda
  name: Bandwidth Script
  kind: tool
  category: network
  type: router-script
